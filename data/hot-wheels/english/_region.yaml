    description: Hot Wheels vehicles from 1998, covering the mainline, collector lines and promotional cars. Much of the mainline was organized into themed segment series, among them Tattoo Machines, Techno Bits, Tropicool, Low 'N Cool, Biohazard, Dash 4 Cash, Race Team IV, Artistic License, Mixed Signals, Flyin' Aces, Sugar Rush and Tech Tones. First Editions, Treasure Hunt cars and Preview Editions appeared alongside them, as did a 30th Anniversary series that was also issued in Zamac. Collector releases came from conventions, including charity convention cars, and from Toy Fair. Promotional cars were made with Avon, JC Whitney and Lexmark, and a bonus car was offered by mail-in.
