    name: '1996'
    description: Hot Wheels vehicles from 1996, built around the year's mainline segment series. These themed segments included the Race Truck, Flamethrower, Space, Mod Bod, Sports Car, Splatter Paint, Street Eaters, Fast Food and Fire Squad series. Dark Rider, Race Team and Silver Series each returned with a second series. First Editions and the Treasure Hunt series ran alongside them. Outside the mainline, the year had convention cars with a charity edition, Toy Fair cars, a mail-in bonus car, holiday and racing livery releases, computer cars, a JC Whitney release and an Olympic set for FAO Schwarz.
