name: Global
description: ''
generations:
  hw-1968:
    name: '1968'
    description: The opening year of Hot Wheels, when the line launched with sixteen new vehicles in 1968. Collectors often call that first group of cars the Original 16 or the Sweet Sixteen. The year holds two series, The Sweet 16 and Hot Wheels Grand Prix.
    series:
      - grand-prix
      - sweet-16
  hw-1969:
    name: '1969'
    description: Hot Wheels cars from 1969, grouped into two series, Grand Prix and Other. That year Mattel launched its first series, the Exclusive Grand Prix, sold on blistercards specially marked for it. Every car in the Grand Prix series is a race car. The Ford J-Car, first released in 1968, also appeared in the Exclusive Grand Prix blister packs. The rest of the year's releases make up the Other series.
    series:
      - grand-prix
      - other
  hw-1970:
    name: '1970'
    description: Hot Wheels vehicles from 1970, grouped into the Grand Prix, Heavyweights and Spoilers lines along with the year's other releases. The Grand Prix line has racing cars, the Ferrari 312P and the Porsche 917. The Heavyweights are working trucks, among them an ambulance, a cement mixer, a dump truck, a fire engine, a moving van and a tow truck. The Spoilers line includes the Heavy Chevy, King 'Kuda, Light My Firebird, Nitty Gritty Kitty and TNT Bird. Other models that year range from the Classic Nomad and Red Baron to the Snake and Mongoose. Club Kit versions of the Heavy Chevy and King 'Kuda appeared alongside the Boss Hoss Silver Special, and the Sky Show Deora and Sky Show Fleetside came only in a Sky Show set.
    series:
      - grand-prix
      - heavyweights
      - other
      - spoilers
  hw-1971:
    name: '1971'
    description: "Hot Wheels cars from 1971, split into four series: Heavyweights, Sizzlers, Spoilers and a group of other releases. The year's main lineup brought new castings such as the AMX/2, Classic Cord, Olds 442, Short Order, Six Shooter and What-4. The Heavyweights included the Fuel Tanker, S'Cool Bus, Snorkel, Team Trailer and Waste Wagon. The Spoilers line added the Boss Hoss, Evil Weevil and Sugar Caddy. A Mongoose vs Snake pairing also appeared that year, with the Mongoose II and Snake II alongside Mongoose and Snake rail dragsters."
    series:
      - heavyweights
      - other
      - sizzlers
      - spoilers
  hw-1972:
    name: '1972'
    series:
      - farbs
      - other
      - zowees
  hw-1973:
    name: '1973'
    description: "Hot Wheels vehicles released in 1973, split into four series: Shell Promo, Super Chromes, Zowees and a general series for the year's other releases. The year added three new castings, Double Header, Superfine Turbine and Sweet 16. The main line that year also included cars such as Alive '55, Buzz Off, Ferrari 312P, Mongoose II, Snake II, Police Cruiser, Paddy Wagon and Red Baron. The Shell Promo cars included Twin Mill, Swingin' Wing, Splittin' Image, Bugeye, Jet Threat, Strip Teaser and Ferrari 512P."
    series:
      - other
      - shell-promo
      - super-chromes
      - zowees
  hw-1974:
    name: '1974'
    series:
      - other
  hw-1975:
    name: '1975'
    series:
      - other
      - sizzlers
      - toy-fair
  hw-1976:
    name: '1976'
    series:
      - other
      - super-chromes
  hw-1977:
    name: '1977'
    description: Hot Wheels vehicles from 1977, split into two series. One is the Super Chromes line, and the other gathers the rest of the year's releases.
    series:
      - other
      - super-chromes
  hw-1978:
    name: '1978'
    description: Hot Wheels vehicles released in 1978, split into three series. The Super Chromes line and the Sizzlers each have their own series, and a third series gathers the rest of the year's vehicles. Every 1978 vehicle was made in Hong Kong and has blackwall tires.
    series:
      - other
      - sizzlers
      - super-chromes
  hw-1979:
    name: '1979'
    description: Hot Wheels vehicles released in 1979, split into the Super Chromes line and a group of other releases from that year. Every car in the 1979 range was made in Hong Kong and came on basic black wall wheels. Each one was advertised with a free patch that buyers could get by sending proof of six purchases. The patches were designed around the different sub-lines of the 1979 range.
    series:
      - other
      - super-chromes
  hw-1980:
    name: '1980'
    description: Hot Wheels released in 1980 fall into two series, the Speed Machines line and a general group for that year's other releases. Every vehicle made in 1980 was produced in Hong Kong. The year also saw the start of the Workhorses Series.
    series:
      - other
      - speed-machines
  hw-1981:
    name: '1981'
    description: Hot Wheels vehicles released during 1981. The year has two series, one for Steering Rigs and one for the year's other releases. The 1981 Hot Wheels line had 75 cars in all.
    series:
      - other
      - steering-rigs
  hw-1982:
    name: '1982'
    series:
      - other
      - speed-machines
      - steering-rigs
  hw-1983:
    name: '1983'
    description: The 1983 Hot Wheels year, covering five series. It brings together the Color Racers, Real Riders and Speed Machines lines, the Truck Co. Action Set and a group of other releases from the same year. The 1983 lineup also had an Extras Series, sold in special packaging with a removable piece of each casting packed apart from the car.
    series:
      - color-racers
      - other
      - real-riders
      - speed-machines
      - truck-co-action-set
  hw-1984:
    name: '1984'
    description: Hot Wheels vehicles released in 1984, grouped into three series. Two of them are named lines, Real Riders and Speed Machines. The third gathers the year's other releases that fall outside those two lines.
    series:
      - other
      - real-riders
      - speed-machines
  hw-1985:
    name: '1985'
    description: Hot Wheels vehicles released in 1985, grouped into three series. Two of them are named lines, Hi-Rakers and Real Riders. The third gathers the year's other releases that fall outside those two lines.
    series:
      - hi-rakers
      - other
      - real-riders
  hw-1986:
    name: '1986'
    series:
      - other
      - real-riders
  hw-1987:
    name: '1987'
    description: Hot Wheels vehicles released in 1987, grouped into three series. They cover convention cars, Real Riders and other releases from that year. Every vehicle made in 1987 was produced in Malaysia.
    series:
      - convention-cars
      - other
      - real-riders
  hw-1988:
    name: '1988'
    description: Hot Wheels vehicles released in 1988, grouped into three series. Besides the year's other releases, it includes the Color Racers line and a set of convention cars. Every Hot Wheels vehicle released that year was made in Malaysia.
    series:
      - color-racers
      - convention-cars
      - other
  hw-1989:
    name: '1989'
    description: Hot Wheels releases from 1989. The year has three series. One holds the charity cars tied to the Hot Wheels convention, one covers the Park 'N Plates line, and the third gathers other vehicles released that year.
    series:
      - convention-cars-charity
      - other
      - park-n-plates
  hw-1990:
    name: '1990'
    description: Hot Wheels releases from 1990, spread across six series. They include the Action Machines, California Customs (shortened to Cal Customs), Micro Color Racers and Park 'N Plates lines, along with the Billionth Car Set. Vehicles from that year that belong to none of these lines are gathered in a separate series of other 1990 releases.
    series:
      - action-machines
      - billionth-car-set
      - california-cal-customs
      - micro-color-racers
      - other
      - park-n-plates
  hw-1991:
    name: '1991'
    description: Hot Wheels vehicles released in 1991, organized into eight series. The year's lines include California Customs, Cap Blastin', Park 'N Plates and Auto City, along with two Convertables series, one of hot rods and one of wreckers. Convention cars from that year make up a series of their own, and a further series covers 1991 vehicles that belong to none of the named lines.
    series:
      - auto-city
      - california-cal-customs
      - cap-blastin
      - convention-cars
      - convertables-hot-rods
      - convertables-wreckers
      - other
      - park-n-plates
  hw-1992:
    name: '1992'
    description: Hot Wheels vehicles from 1992, grouped into seven series. Convention cars make up two of them, a regular convention release and a separate charity edition. The year also includes cars tied to Toy Fair and three named lines, Pro Circuit, Revealers and Tattoo Machines. Other 1992 releases that fit none of these groups are collected in a general series.
    series:
      - convention-cars
      - convention-cars-charity
      - other
      - pro-circuit
      - revealers
      - tattoo-machines
      - toy-fair
  hw-1993:
    name: '1993'
    description: Hot Wheels releases from 1993, a year marked by the 25th Anniversary series. The year also brought the Vintage Collection, the Revealers and Tattoo Machines lines, plus a Demolition Man series. Smaller releases include cars made for Toy Fair and charity cars tied to the collectors convention, and a group of other releases rounds out the year's eight series.
    series:
      - 25th-anniversary
      - convention-cars-charity
      - demolition-man
      - other
      - revealers
      - tattoo-machines
      - toy-fair
      - vintage-collection
  hw-1994:
    name: '1994'
    description: Hot Wheels releases from 1994, grouped into eleven series. Next to a main line, the year has a 25th Anniversary range and a Vintage Collection, along with Auto City and Racing Livery releases. For collectors there are two Premier Collection World Class series, numbered 2 and 6, and convention cars, one of them a charity release. Cars made for the Toy Fair are also part of the year, and releases that fit none of these are grouped as Other.
    series:
      - 2016-main-line
      - 25th-anniversary
      - auto-city
      - convention-cars
      - convention-cars-charity
      - hot-wheels-racing-livery
      - other
      - premier-collection-world-class-series-2
      - premier-collection-world-class-series-6
      - toy-fair
      - vintage-collection
  hw-1995:
    name: '1995'
    description: Hot Wheels vehicles released in 1995. That year's main line was split into themed segment series, among them Race Team, Krackle Car, Steel Stamp, Pearl Driver, Dark Rider, Roarin' Rods, Hot Hubs, Speed Gleamer, Real Riders, Silver, Photo Finish and Racing Metals. Treasure Hunt cars and the Model Series also came out that year. Outside the main line, the year includes convention cars with a charity edition, Toy Fair pieces, a holiday release, a European Ferrari line, Auto City, Computer Cars, Top Speed and a JC Whitney release.
