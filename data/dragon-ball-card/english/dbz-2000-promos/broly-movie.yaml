name: Broly Movie Promos
description: A small group of promotional cards for the Dragon Ball Z
  Collectible Card Game, tied to the Broly movie and released in English in June
  2000. It has about three cards. The game was produced by Score Entertainment,
  and its cards use stills taken directly from the anime as artwork.
