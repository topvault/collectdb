name: Miscellaneous Promos
description: A small group of promotional cards for the Dragon Ball Z
  Collectible Card Game, released in English in December 2000 and numbering
  about five cards. They were issued separately from the game's booster sets
  during its first year. Score Entertainment produced the game, and like its
  other cards these use stills taken directly from the anime as artwork.
releaseDate: '2000-12-01'
