name: Tin Promos
description: A small group of about four promotional cards for the Dragon Ball Z
  Collectible Card Game, released in English in October 2000. The game was
  produced by Score Entertainment and launched that year with the Saiyan Saga.
  Like its other cards, these promos use stills taken directly from the anime as
  artwork.
releaseDate: '2000-10-01'
