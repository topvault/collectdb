name: Cooler Movie Promos
description: A small group of three promotional cards for the Dragon Ball Z
  Collectible Card Game, released in English in July 2000 and named for the
  Cooler movie. The game was first published by Score Entertainment that year.
  Like the rest of the game, its cards use stills taken directly from the anime
  as artwork.
releaseDate: '2000-07-01'
