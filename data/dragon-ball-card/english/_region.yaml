name: English
generations:
  dbz-2000:
    name: Dragon Ball Z (2000)
    description: The original English run of the Dragon Ball Z Collectible Card Game
      from Score Entertainment, with eleven sets released through 2000, beginning
      with the Saiyan Saga and arriving about once a month from February until the
      Kid Buu Saga in November. Each set is named after a saga of the anime, and its
      card art uses scenes taken straight from the show. The sets range from about
      141 to about 257 cards. The Saiyan Saga and Trunks Saga were backed by hero
      and villain Starter decks, while the Frieza Saga was sold in booster packs
      only. Later sets brought in new rules, such as the endurance mechanic in the
      Cell Games Saga and the Sensei cards of the World Games Saga, which let a
      player build a separate side deck.
    series:
      - saiyan-saga
      - frieza-saga
      - trunks-saga
      - androids-saga
      - cell-saga
      - cell-games-saga
      - world-games-saga
      - babidi-saga
      - buu-saga
      - fusion-saga
      - kid-buu-saga
  dbz-2000-subsets:
    name: Dragon Ball Z (2000) Subsets
    description: 'The smaller companion sets of the Dragon Ball Z Collectible Card
      Game, issued in English during 2000 by Score Entertainment alongside its main
      expansions. Lost Villains and Puppet Show, both part of the World Games Saga,
      were the first, and later subsets accompanied the Babidi, Fusion, Kid Buu and
      Broly releases. Their main purpose was to bring in characters from the films
      or ones missing from recent sets, so several are built on the movies, such as
      Super Android 13! and Broly - The Legendary Super Saiyan. Four of them hold
      about 34 to 36 cards each, while Broly: Second Coming has only about 4. As in
      the rest of the game, the artwork uses stills taken straight from the anime
      and films.'
    series:
      - lost-villains
      - puppet-show
      - movie-7
      - broly
      - cosmic-anthology
      - bojack-unbound
      - broly-second-coming

  dbz-2000-league:
    name: Dragon Ball Z (2000) League
    description: The 2000 league program for the Dragon Ball Z Collectible Card
      Game, issued in English as six seasons between February and June 2000. Each
      season is named after a character. The run starts with Gohan and Krillin,
      continues with Yamcha, Goku and Majin Buu, and ends with Vegeta. The seasons
      were small, and the Gohan and Krillin seasons each hold about 11 cards. Score
      Entertainment produced the game, which uses stills taken from the anime as
      card artwork.
    series:
      - gohan-season
      - krillin-season
      - yamcha-season
      - goku-season
      - majin-buu-season
      - vegeta-season

  dbz-2000-redemption:
    name: Dragon Ball Z (2000) Redemption
    description: Redemption cards from the first English year of the Dragon Ball Z
      Collectible Card Game, dated between March and June 2000. These six small sets
      were given out through redemption offers rather than sold in packs. Each is
      tied to a part of the game, from the Frieza Saga and Cell Saga through the
      Cell Games, World Games Saga and Fusion Saga. The Frieza Saga and Cell Saga
      groups were wrapper redemptions, exchanged for pack wrappers, and another
      group gives the Earth Dragon Ball cards alternate artwork. The sets are tiny,
      from about three cards for the World Games Saga to about ten for the Frieza
      Saga. Score Entertainment produced the game, and its card art is stills taken
      from the anime.
    series:
      - frieza-saga-wrapper
      - earth-dragon-ball
      - cell-saga-wrapper
      - cell-games
      - world-games-saga
      - fusion-saga

  dbz-2000-promos:
    name: Dragon Ball Z (2000) Promos
    description: The English promotional cards from the first year of the Dragon
      Ball Z Collectible Card Game, which Score Entertainment launched in 2000 with
      the Saiyan Saga. Sixteen groups came out between April and December 2000, and
      most are small runs of three to ten cards. They include promos from Burger
      King and Kraft, cards linked to Infogames and the Game Boy, tie-ins for the
      Broly and Cooler movies and for DVD and video releases, and tin promos. The
      year ended with larger releases, the two Capsule Corp Power Packs and about 38
      cards bearing the Irwin Toys name, along with volunteer rewards. As in the
      main expansions, the artwork is stills taken from the anime.
    series:
      - burger-king
      - tuff-enuff
      - scoring-zone
      - collectors-club
      - infogames
      - broly-movie
      - cooler-movie
      - dvd-promos
      - x-promos
      - tin-promos
      - kraft-promos
      - misc-promos
      - volunteer-rewards
      - capsule-corp-power-pack-1
      - capsule-corp-power-pack-2
      - irwin-toys

  dbz-2005:
    name: Dragon Ball Z (2005)
    description: The English Dragon Ball Z card game's 2005 era, made up of three
      sets. Arrival was released in 2005, Showdown followed in February with about
      121 cards, and Transformation came out in March with about 128 cards. These
      sets were released late in Score Entertainment's run as the game's first
      producer, which began with the Saiyan Saga in 2000 and ended in June 2006. As
      in the rest of the line, the card artwork uses stills taken directly from the
      anime.
    series:
      - arrival
      - showdown
      - transformation

  db-2008:
    name: Dragon Ball (2008)
    description: Bandai's Dragon Ball Collectible Card Game in English, launched in
      the United States on 18 July 2008 as a new game separate from Score
      Entertainment's earlier Dragon Ball Z Collectible Card Game. It ran for five
      main sets, from Warriors Return to Clash of Sagas, with each set holding
      roughly 100 to 113 cards. Only the first set, Warriors Return, came with
      starter decks, one built around Goku and one around Frieza. Later sets added
      stronger forms of the characters, such as Super Saiyan transformations in The
      Awakening and Cell and Mecha Frieza in The Destructive Fury. A small run of
      about nine promotional cards came out in June 2008, a month before the game
      launched.
    series:
      - warriors-return
      - awakening
      - destructive-fury
      - fusion
      - clash-of-sagas
      - promos

  dbz-2014:
    name: Dragon Ball Z (2014)
    description: The 2014 English run of the Dragon Ball Z Trading Card Game, Panini
      America's reboot of the card game Score Entertainment had produced from 2000
      until June 2006. Seven sets came out in quick succession over the year,
      starting with the Premier Set and continuing roughly monthly from February to
      July with Heroes and Villains, Movie Collection, Evolution, Perfection,
      Vengeance and Awakening. The two largest sets, the Premier Set and Evolution,
      each have more than 300 cards, while most of the others have about 155 to 160.
      As in the original game, the card artwork uses stills taken directly from the
      anime, and Movie Collection also draws on other Dragon Ball media.
    series:
      - premier-set
      - heroes-and-villians
      - movie-collection
      - evolution
      - perfection
      - vengeance
      - awakening

  db-gt:
    name: Dragon Ball GT
    description: 'The Dragon Ball GT era of the Score Entertainment card game, which
      began in 2000 as the Dragon Ball Z Collectible Card Game and went on as the
      Dragon Ball GT Trading Card Game. Its English sets are dated to February 2004.
      Four large saga sets make up the core: Baby Saga, Super Android 17 Saga,
      Shadow Dragon Saga and Lost Episodes Saga, each with roughly 160 to 315 cards.
      Two smaller sets, Broly: The Second Coming and the Villain Invasion subset,
      sit alongside them. Promotional cards came through organized play, seasonal
      league programs and other channels such as tins, blister packs, videos and
      judge rewards. As in earlier eras, the card artwork uses stills taken directly
      from the anime.'
    series:
      - baby-saga
      - broly-subset
      - super-andriod-17-saga
      - shadow-dragon-saga
      - villain-invasion-subset
      - lost-episodes-saga
      - op-promos
      - league-promos
      - misc-promos

  dbs-eb-block:
    name: 'DBS: EB Block'
    description: The EB block of English Dragon Ball cards from the DBS era is made
      up of a single set. Battle Evolution Booster came out in English in March 2021
      with about 125 cards. It was the first Battle Evolution Booster and carries
      the code EB1, whose EB prefix gives the block its name.
    series:
      - battle-evolution-booster-eb1
  dbs-unison-warrior-block:
    name: 'DBS: Unison Warrior Block'
    description: The Unison Warrior block of the Dragon Ball Super Card Game spans
      eight English booster sets, from Rise of the Unison Warrior (BT10) in July
      2020 to Ultimate Squad (BT17) in June 2022. The sets are numbered in order by
      their BT codes, and most hold roughly 150 to 180 cards. The first two, Rise of
      the Unison Warrior and Vermillion Bloodline, were also issued in a 2nd Edition
      run in both normal and foil. Starting with Vicious Rejuvenation, every set
      came with its own group of pre-release cards. From Saiyan Showdown onward,
      those pre-release cards went out a week before the main release.
    series:
      - supreme-rivalry-bt13
      - vicious-rejuvenation-bt12
      - vermillion-bloodline-bt11
      - rise-of-the-unison-warrior-bt10
      - cross-spirits-bt14
      - saiyan-showdown-bt15
      - realm-of-the-gods-bt16
      - ultimate-squad-bt17
  dbs-zenkai-block:
    name: 'DBS: Zenkai Block'
    description: The Zenkai block of the Dragon Ball Super Card Game in English,
      also called the Zenkai Series, spans fourteen booster sets, from Dawn of the
      Z-Legends (BT18) in September 2022 to Impact Beyond Dimensions (BT31) in July
      2026. New sets came out a few times a year, and most hold about 140 to 160
      cards. Most sets also had a separate group of pre-release cards, usually about
      57 to 68 cards, often issued a week before the set itself. From Prismatic
      Clash (BT28) in September 2025 onward, that group became a larger run of about
      73 to 74 cards tied to each set's release event.
    series:
      - dawn-of-the-z-legends-bt18
      - fighters-ambition-bt19
      - power-absorbed-bt20
      - wild-resurgence-bt21
      - critical-blow-bt22
      - perfect-combination-bt23
      - beyond-generations-bt24
      - legend-of-the-dragon-balls-bt25
      - ultimate-advent-bt26
      - history-of-z-bt27
      - prismatic-clash-bt28
      - fearsome-rivals-bt29
      - three-glorious-fighters-bt30
      - impact-beyond-dimensions-bt31
  dbs-bt-block:
    name: 'DBS: BT Block'
    description: The first run of numbered BT booster sets for the Dragon Ball Super
      Card Game in English, starting with Galactic Battle [BT1] in July 2017 and
      ending with Universal Onslaught [BT9] in February 2020. A new main set came
      out every three to five months, and each held between about 142 and 163 cards.
      Every set carries a BT code that matches its place in the sequence. From
      Destroyer Kings [BT6] in March 2019 onward, each set also had its own group of
      pre-release cards. There were about 60 for that set and about 108 for each of
      the three sets after it.
    series:
      - union-force-bt2
      - malicious-machinations-bt8
      - assault-of-the-saiyans-bt7
      - universal-onslaught-bt9
      - miraculous-revival-bt5
      - colossal-warfare-bt4
      - destroyer-kings-bt6
      - cross-worlds-bt3
      - galactic-battle-bt1
  dbs-themed-sets-tb:
    name: 'DBS: Themed Sets [TB]'
    description: The themed sets of the Dragon Ball Super Card Game in English,
      which carry a TB code rather than the BT code used by the game's main booster
      sets. Three of them came out between May 2018 and 2019. The Tournament of
      Power [TB1] started the line in May 2018 with about 107 cards and takes its
      name from the Tournament of Power. World Martial Arts Tournament [TB2]
      followed in September 2018 with about 78 cards. Clash of Fates [TB3] was the
      third, released in 2019 and also with about 78 cards.
    series:
      - clash-of-fates-tb3
      - world-martial-arts-tournament-tb2
      - the-tournament-of-power-tb1
  dbs-draft-sets:
    name: 'DBS: Draft Sets'
    description: This group holds the English draft sets of the Dragon Ball Super
      Card Game, three releases from September 2019 to November 2020 under the codes
      DB1 to DB3. Divine Brawl came first in September 2019 with about 130 cards.
      Divine Multiverse followed in March 2020 and is the largest of the three, with
      about 177 cards. Giant Force came last in November 2020 with about 144 cards.
    series:
      - giant-force-db3
      - divine-brawl-db1
      - divine-multiverse-db2
  dbs-starter-decks:
    name: 'DBS: Starter Decks'
    description: The numbered line of English starter decks for the Dragon Ball
      Super Card Game, from The Awakening (SD01) in 2018 to Spirit of Potara, Clan
      Collusion and Saiyan Wonder (SD12 to SD14), which all came out in June 2020.
      The decks carry codes SD01 to SD14 and were sold as preconstructed,
      ready-to-play products rather than in booster packs. In 2018 they arrived in
      pairs in June, September and November. From 2019 they mostly came out one at a
      time, from Rising Broly in April 2019 to Instinct Surpassed in February 2020.
      Most decks have only about five cards of their own. Rising Broly (SD08) is
      built around Broly and has about ten.
    series:
      - rising-broly-dbs-sd08
      - clan-collusion-dbs-sd13
      - spirit-of-potara-dbs-sd12
      - instinct-surpassed-dbs-sd11
      - parasitic-overlord-dbs-sd10
      - saiyan-legacy-dbs-sd09
      - saiyan-wonder-dbs-sd14
      - shenrons-advent-dbs-sd07
      - resurrected-fusion-dbs-sd06
      - the-crimson-saiyan-dbs-sd05
      - the-guardian-of-namekians-dbs-sd04
      - the-dark-invasion-dbs-sd03
      - the-extreme-evolution-dbs-sd02
      - the-awakening-dbs-sd01
  dbs-expert-decks:
    name: 'DBS: Expert Decks'
    description: This group covers the English Expert Decks for the Dragon Ball
      Super Card Game, three ready-made decks released between August 2019 and
      February 2020. Universe 6 Assailants came first under the code XD01, followed
      by Android Duality (XD02) in November 2019 and The Ultimate Life Form (XD03)
      in February 2020. Each deck holds about 10 cards of its own.
    series:
      - android-duality-dbs-xd02
      - the-ultimate-life-form-dbs-xd03
      - universe-6-assailants-dbs-xd01
  dbs-expansion-sets:
    name: 'DBS: Expansion Sets'
    description: The English run of Expansion Sets for the Dragon Ball Super Card
      Game, a line of small releases with EX set codes that sat apart from the
      game's main booster sets. It began with Mighty Heroes [EX01] and Dark Demon's
      Villains [EX02] in February 2018 and ran to Saiyan Boost [EX17] and Namekian
      Boost [EX18] on 25 June 2021. Most sets came out in pairs and hold only about
      4 to 9 cards each, such as Saiyan Surge and Namekian Surge in 2020. A few were
      larger, including Ultimate Box [EX03] in October 2018 with about 33 cards, and
      Fusion Hero [EX07] and Forsaken Warrior [EX08] in October 2019 with about 26
      to 28 cards each.
    series:
      - battle-enhanced-ex15
      - battle-advanced-ex14
      - universe-11-ex12
      - universe-7-unison-ex11
      - namekian-surge-ex10
      - saiyan-surge-ex09
      - forsaken-warrior-ex08
      - fusion-hero-ex07
      - unity-of-destruction-ex05
      - unity-of-saiyans-ex04
      - ultimate-box-ex03
      - dark-demons-villains-ex02
      - mighty-heroes-ex01
      - saiyan-boost-ex17
      - namekian-boost-ex18
  dbs-anniversary-boxes:
    name: 'DBS: Anniversary Boxes'
    description: The English anniversary releases of the Dragon Ball Super Card
      Game, running from the Special Anniversary Box (EX06) in July 2019 to the
      Premium Anniversary Box 2025 (EX25) in July 2025. Every release carries an EX
      set code. Most are yearly anniversary boxes or sets, among them the 5th
      Anniversary Set in October 2022 and the Premium 7th Anniversary Box in
      September 2024, and they usually hold about 55 to 75 cards. From 2023 the
      boxes were sold under the Premium Anniversary Box name. Three smaller Ultimate
      Deck products came out between them in 2021, 2022 and 2023, each with about 10
      to 23 cards.
    series:
      - ultimate-deck-ex16
      - special-anniversary-box-ex06
      - special-anniversary-2020-ex13
      - special-anniversary-set-2021-ex19
      - ultimate-deck-2022-ex20
      - 5th-anniversary-set-ex21
      - ultimate-deck-2023-ex22
      - premium-anniversary-box-2023-ex23
      - premium-7th-anniversary-box-2024-ex24
      - premium-anniversary-box-2025-ex25
  dbs-special-sets:
    name: 'DBS: Special Sets'
    description: The special releases of the Dragon Ball Super Card Game in English
      sit outside the main numbered booster sets. They began with Revision Pack 2020
      in November 2020 and ran to Collector's Selection Vol. 3 in April 2023. Most
      are small. The three Collector's Selection volumes hold about 18 cards each,
      and the two Theme Selection sets, TS01 and TS02, came out together on 8 July
      2022 with about 15 cards each, one built around the history of Son Goku and
      the other around Vegeta. Mythic Booster, set code MB01, is the largest at
      about 63 cards and was released in January 2022.
    series:
      - revision-pack-2020
      - collectors-selection-vol-1
      - mythic-booster-mb01
      - collectors-selection-vol-2
      - theme-selection-history-of-son-goku-ts01
      - theme-selection-history-of-vegeta-ts02
      - collectors-selection-vol-3
  dbs-promo-cards:
    name: 'DBS: Promo Cards'
    description: This generation gathers the English promotional cards for the
      Dragon Ball Super Card Game in a single series, which began in 2018. The main
      run holds about 730 cards. Two separate groups of event cards sit alongside
      it, one made up of cards given to judges and the other of cards handed out at
      tournaments.
    series:
      - dbs-promo-cards-p
  dbs-fw-boosters:
    name: 'DBS Fusion World: Boosters'
    description: The main booster line of the Dragon Ball Super Card Game Fusion
      World, released in English from Awakened Pulse [FB01] in February 2024 to
      Brightness of Hope [FB11] in October 2026. A new set came out about every
      three months, each with roughly 120 to 140 cards. Each set also had a separate
      group of about 70 to 90 cards for its release event, usually issued a week
      before the set. Several of the early sets added small groups of alternate art
      cards. The game launched on 16 February 2024, and a digital version for
      Windows and macOS followed later that month. Decks are built around a single
      Leader Card, and its color limits which other cards a deck can use.
    series:
      - awakened-pulse-fb01
      - blazing-aura-fb02
      - raging-roar-fb03
      - ultra-limit-fb04
      - new-adventure-fb05
      - rivals-clash-fb06
      - wish-for-shenron-fb07
      - saiyans-pride-fb08
      - dual-evolution-fb09
      - cross-force-fb10
      - brightness-of-hope-fb11
  dbs-fw-starter-decks:
    name: 'DBS Fusion World: Starter Decks'
    description: The preconstructed starter decks of the Dragon Ball Super Card Game
      Fusion World, released in English from February 2024 to March 2026. The game
      launched on 16 February 2024 with four decks, FS01 to FS04, built around Son
      Goku, Vegeta, Broly and Frieza. Later decks featured Bardock, the Mini forms
      of Son Goku and Vegeta, and Shallot and Giblet, and two Starter Deck EX
      releases, FS11 and FS12, followed in March 2026. Each deck holds roughly 12 to
      18 different cards, and several were later followed by small groups of
      alternate art reprints. In the game, a deck is built around a Leader Card
      based on one character and may only use cards of that leader's color.
    series:
      - starter-deck-1-son-goku-fs01
      - starter-deck-2-vegeta-fs02
      - starter-deck-3-broly-fs03
      - starter-deck-4-frieza-fs04
      - starter-deck-5-bardock-fs05
      - starter-deck-6-son-goku-mini-fs06
      - starter-deck-7-vegeta-mini-fs07
      - starter-deck-8-vegeta-mini-super-saiyan-3-fs08
      - starter-deck-9-shallot-fs09
      - starter-deck-10-giblet-fs10
      - starter-deck-ex-the-phase-of-evolution-fs11
      - starter-deck-ex-the-beat-of-ki-fs12
  dbs-fw-special-boosters:
    name: 'DBS Fusion World: Special Boosters'
    description: The special booster releases of the Dragon Ball Super Card Game
      Fusion World, the card game that began on 16 February 2024. Three of these
      sets came out in English between June 2025 and August 2026, alongside the
      game's main booster line. The first two are Manga Boosters. SB01 came out in
      June 2025 and SB02 in November 2025, each with about 110 cards and a separate
      group of about 69 release event cards. Story Booster 01, coded ST01, followed
      in August 2026 as the first Story Booster and is smaller, with about 73 cards.
    series:
      - manga-booster-01-sb01
      - manga-booster-02-sb02
      - story-booster-01-st01
  dbs-fw-promos:
    name: 'DBS Fusion World: Promos'
    description: The English promotional cards for the Dragon Ball Super Card Game
      Fusion World, the Dragon Ball trading card game launched in February 2024. The
      promos are split into two series, both beginning on 14 February 2024. One
      gathers general promotion cards and packs and holds about 100 cards. The other
      covers cards tied to tournaments and championship events and has grown to
      about 285 cards, making it the larger of the two.
    series:
      - promotion-cards-and-packs
      - tournament-and-championship-promos
