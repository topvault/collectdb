name: 'World Games Saga: Puppet Show'
description: One of the first two subsets of the Dragon Ball Z Collectible Card
  Game, issued alongside Lost Villains as part of the World Games Saga. Its
  cards show the short film screened at the opening of the 25th World
  Tournament, a staged retelling in which Hercule supposedly beats Cell,
  complete with hammy acting and Sentai-style costumes. The Personality cards
  cover Cell, Goku, Piccolo, Vegeta and Hercule. Other characters from that part
  of the anime were left out because clean headshots of them could not be taken.
releaseDate: '2000-02-01'
