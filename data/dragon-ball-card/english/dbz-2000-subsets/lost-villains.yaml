name: 'World Games Saga: Lost Villian'
description: A small subset of the World Games Saga for the Dragon Ball Z
  Collectible Card Game, released in English in 2000. It and Puppet Show were
  the first subsets the game produced. The cards show scenes from a Great
  Saiyaman Saga episode in which Goku and Pikkon face a group of villains in
  Hell. Frieza, Jeice and King Cold appear as Personalities, and Grand Kai is
  the subset's Sensei card.
releaseDate: '2000-01-01'
