name: 'Broly: Second Coming'
description: A small subset of the Dragon Ball Z Collectible Card Game, released
  in English in July 2000 with about 4 cards. Score Entertainment produced the
  game, and its subsets were mainly used to bring in characters from the movies
  or ones missing from recent sets. As elsewhere in the game, the card artwork
  is taken from stills of the anime.
releaseDate: '2000-07-01'
