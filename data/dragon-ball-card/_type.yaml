  special-leader-rare:
    name: Special Leader Rare
  concept-rare:
    name: Concept Rare
  dragon-ball-rare:
    name: Dragon Ball Rare
  god-rare:
    name: God Rare
  iconic-attack-rare:
    name: Iconic Attack Rare
  infinite-saiyan-rare:
    name: Infinite Saiyan Rare
  son-gohan-rare:
    name: Son Gohan Rare
  duo-power-rare:
