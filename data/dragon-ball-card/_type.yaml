name: Dragon Ball Cards
support: full
releaseDate: '1988-11-03'
regions:
  - english
remarks:
  # Promotional distribution.
  promo-trophy:
    name: Promo Trophy
    description: Awarded for placing in a competition, such as a winner, finalist, or top-cut printing.
  promo-prerelease:
    name: Promo Prerelease
    description: Prerelease or release-event promotional distribution.
  promo-generic:
    name: Promo
    description: Promotional distribution other than a prerelease, such as a tournament, judge, event, or stamped prize.
