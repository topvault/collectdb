name: Pokémon Cards
support: full
releaseDate: '1996-10-20'
regions:
  - english
  - japanese
remarks:
  # Pre-press (digital blueprint) faults.
  error-design:
    name: Design Error
    description: 'Pre-press blueprint defect hardcoded into the run: wrong layout or image, or wrong text such as HP, stage, Pokédex number, or copyright.'
  # Plate & ink (on-press) faults.
  error-print-obstruction:
    name: Recurring Obstruction
    description: Debris, hair, or dried ink on a plate creating a recurring ink void, stain, or hickey across the run (cigar, highlighter, dot).
  error-print-mechanical:
    name: Mechanical Print Error
    description: Plate physically damaged or the press slipping, such as a plate scratch or gouge stamping a recurring mark, or a doubled impression from press shudder.
  error-ink-starvation:
    name: Recurring Ink Starvation
    description: An ink fountain or feed line running low, leaving faded, washed-out, or miscolored print (low black/yellow ink, gray print).
  error-ink-additional:
    name: Additional Ink Error
    description: Other ink-layer fault not covered by starvation, such as a shifted or mis-trapped white underprint mask (holoshift, holo bleed) or stray ink coverage.
  # Foil substrate & lamination faults.
  error-foil-fault:
    name: Foil / Lamination Error
    description: Foil stock or lamination fault such as a wrong foil substrate swap, a pre-ink shift leaving a raw edge, or lamination tunnelling.
  # Final coats, stamping, and texture faults.
  error-finishing-pass:
    name: Finishing Error
    description: Finishing-pass fault such as a gloss or varnish coat anomaly, a hot-stamp die failure, or a CNC texture/engraving fault.
  # Macro sheet handling & cutting faults.
  error-sheet-handling:
    name: Sheet Handling Error
    description: Macro sheet handling or cutting fault such as misalignment, a missing set symbol, a fold-over, or a miscut.
  # Packaging faults.
  error-packaging:
    name: Packaging Error
    description: Booster-pack assembly damage such as a factory crimp embedding a grid into the border, or wrapper folds and tears.
  # Pre-production / non-retail artifacts.
  test-print:
    name: Test Print
    description: Test print or test sheet released ahead of or outside the normal production run.
  test-proof:
    name: Test Proof
    description: Proof card such as a Victory Proof.
  test-sample:
    name: Sample
    description: Production sample or sample set.
  # Promotional distribution.
  promo-trophy:
    name: Promo Trophy
    description: Awarded for placing in a competition, such as a winner, finalist, or top-cut printing.
  promo-prerelease:
    name: Promo Prerelease
    description: Prerelease or staff-stamped promotional distribution.
  promo-generic:
    name: Promo
    description: Promotional distribution other than a prerelease, such as an event, league, store, or stamped giveaway.
  # Retail reprints.
  reprint-championship-deck:
    name: Championship Deck
    description: A World Championship Deck, sold at retail as a reprint of a deck played at the World Championships.
rarities:
  # The rarity mark printed on the card, written by name in details.rarity.
  common:
    name: Common
    description: A circle.
  uncommon:
    name: Uncommon
    description: A diamond.
  rare:
    name: Rare
    description: A star, holo or not. Includes cards that sources name for their mechanic, such as V, ex, LV.X, Prime, BREAK and LEGEND.
  double-rare:
    name: Double Rare
    description: Two black stars; RR in Japanese.
  triple-rare:
    name: Triple Rare
    description: RRR in Japanese.
  ultra-rare:
    name: Ultra Rare
    description: In English, a full-art card (two silver stars from Scarlet & Violet on); UR in Japanese, usually a gold card.
  super-rare:
    name: Super Rare
    description: SR in Japanese.
  secret-rare:
    name: Secret Rare
    description: Numbered past the set's printed total.
  hyper-rare:
    name: Hyper Rare
    description: Three gold stars; HR in Japanese.
  art-rare:
    name: Art Rare
    description: AR in Japanese.
  special-art-rare:
    name: Special Art Rare
    description: SAR in Japanese.
  illustration-rare:
    name: Illustration Rare
    description: One gold star.
  special-illustration-rare:
    name: Special Illustration Rare
    description: Two gold stars.
  character-rare:
    name: Character Rare
    description: CHR in Japanese.
  character-super-rare:
    name: Character Super Rare
    description: CSR in Japanese.
  trainer-rare:
    name: Trainer Rare
    description: TR in Japanese.
  shiny-rare:
    name: Shiny Rare
    description: S in Japanese.
  shiny-super-rare:
    name: Shiny Super Rare
    description: SSR in Japanese.
  shiny-ultra-rare:
    name: Shiny Ultra Rare
  ace-spec-rare:
    name: ACE SPEC Rare
  amazing-rare:
    name: Amazing Rare
    description: A in Japanese.
  radiant-rare:
    name: Radiant Rare
    description: K in Japanese.
  prism-rare:
    name: Prism Rare
  classic-collection:
    name: Classic Collection
  black-white-rare:
    name: Black White Rare
    description: BWR.
  mega-attack-rare:
    name: Mega Attack Rare
  mega-ultra-rare:
    name: Mega Ultra Rare
    description: MUR in Japanese.
  mega-hyper-rare:
    name: Mega Hyper Rare
  futuristic-rare:
    name: Futuristic Rare
  rgb-rare:
    name: RGB Rare
  promo:
    name: Promo
    description: The PROMO mark of a promo card, printed in place of a rarity.
  none:
    name: None
    description: Printed with no rarity mark, as in McDonald's collections and trainer kits.
finishes:
  # Written by name in details.finish; a card without one is non-holo (or nonfoil).
  holo:
    name: Holo
    description: Holofoil in the art box or across the card, in any pattern such as Cosmos or Cracked Ice.
  reverse-holo:
    name: Reverse Holo
    description: Holofoil everywhere except the art box.
