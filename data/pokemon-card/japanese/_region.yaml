  sm:
    name: Sun & Moon Era
    description: The Sun & Moon Era is the Japanese run of the Pokémon Card Game
      from November 2016 to October 2019, issued by The Pokémon Company and based on
      the Generation VII games. It brought Pokémon-GX, then Prism Star cards and
      finally TAG TEAM Pokémon-GX. Between them came nineteen subsets, from enhanced
      expansion packs and High Class Packs to movie packs, along with a steady
      stream of starter sets, trainer boxes and deck build boxes. English releases
      usually folded each Japanese main expansion and its subsets into one larger
      set, and Japanese 1st edition cards were no longer printed, so every set here
      is unlimited only.
