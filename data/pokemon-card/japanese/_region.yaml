  xy:
    name: XY Era
    description: The XY and XY BREAK eras of the Japanese Pokémon Card Game, running
      from the XY Beginning Set in November 2013 through the Best of XY pack in
      April 2017. They are built on Generation VI Pokémon and the Kalos region, with
      Omega Ruby and Alpha Sapphire material in the later expansions. Mega Evolution
      came in as M Pokémon-EX, Ancient Traits arrived with Gaia Volcano and Tidal
      Storm, and Pokémon BREAK was added with Blue Shock and Red Flash. Seven main
      expansions made up the XY era, and four more followed in the XY BREAK era. A
      string of concept-pack subsets, decks and boxes filled the gaps, and most main
      expansions became an English XY Series set.
