  mega:
    name: Mega Evolution Era
    description: The MEGA Series of the Japanese Pokémon Trading Card Game, which
      began on August 1, 2025 with Mega Brave and Mega Symphonia. Those first sets
      brought Mega Evolution back to the game for the first time since the XY Series
      and Sun & Moon Series, as Pokémon ex worth 3 Prize cards. The expansions draw
      on Pokémon Legends Z-A, then on its Mega Dimension DLC with Abyss Eye, and on
      Omega Ruby and Alpha Sapphire with Storm Emeralda on July 31, 2026. Their
      cards go into English sets such as Mega Evolution, Phantasmal Flames and
      Perfect Order, and Start Deck 100 Battle Collection brought the first J
      regulation mark.
