  legend:
    name: LEGEND Era
    description: The LEGEND era of the Japanese Pokémon Card Game ran from October
      2009 to July 2010 and is based on the HeartGold and SoulSilver games, with
      Generation II Pokémon. It has three main expansions, HeartGold Collection and
      SoulSilver Collection, Reviving Legends and Clash at the Summit, plus the
      small subset Lost Link. It introduced Pokémon Prime and the two-part Pokémon
      LEGEND cards. The English releases combined the Japanese sets into HeartGold &
      SoulSilver, Undaunted and Triumphant, with Lost Link folded into Triumphant.
      Promos carry the L-P suffix, and beginner decks and an online-battle deck kit
      followed in November 2009.
    series:
      - legend-promos
      - heartgold-collection
      - soulsilver-collection
      - reviving-legends
      - lost-link
      - clash-at-the-summit
      - battle-starter-decks
      - leafeon-vs-metagross-expert-deck

  energy:
    name: Unnumbered Energies
    description: Basic Energy card sets released in Japan alongside larger products,
      in 2009 and in 2025. Each set holds one card for every basic type, and both
      were released on the same day as paired expansion packs.
    series:
      - 2009-energies
      - mega-evolution-energies

  bw:
    name: Black & White Era
    description: The Black & White era of the Japanese Pokémon Card Game, running
      from the Black Collection and White Collection expansions in December 2010 to
      Megalo Cannon in March 2013. Nine main expansions came out in that span, most
      of them as twin pairs that share a release date, and three subsets sit between
      and after them (Dragon Selection, Shiny Collection and EX Battle Boost, the
      last in July 2013). The era is built on Generation V Pokémon and the Unova
      games. It introduced Abilities and Full Art cards, then Pokémon-EX in Psycho
      Drive and Hail Blizzard and ACE SPEC cards in Freeze Bolt and Cold Flare. The
      main expansions became English Black & White Series sets, usually with a
      different name and sometimes with decks folded in.
