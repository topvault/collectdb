name: Japanese
generations:
  original:
    name: Original Era
    description: The first six numbered expansions of the Japanese Pokémon Card
      Game, released between October 1996 and June 1999 and all built around the
      Generation I Pokémon. They are Expansion Pack, Pokémon Jungle, Mystery of the
      Fossils, Rocket Gang, Leaders' Stadium and Challenge from the Darkness, and
      they became the English Base Set, Jungle, Fossil, Team Rocket, Gym Heroes and
      Gym Challenge. The English Gym sets each combine cards from both Japanese Gym
      expansions. The generation also holds the Southern Islands movie set, an Intro
      Pack with two beginner decks, the Quick Starter Gift Set and the unnumbered
      promos.
    series:
      - expansion-pack
      - jungle
      - fossil
      - rocket-gang
      - leaders-stadium
      - challenge-from-the-darkness
      - southern-islands
      - intro-pack
      - quick-starter-gift-set
      - miscellaneous-promos

  vm:
    name: Vending Machine Series
    description: Three sets of Vending Machine cards released in Japan in 1998,
      known in Japanese as Expansion Sheets. The cards came as peel-off sheets of
      three from vending machines instead of booster packs, and Blue, Red and Green
      are the series names that collectors use. They are printed on glossy stock and
      were never released outside Japan. Each sheet number always carries the same
      cards, so a collector could complete a series by finding all 18 sheets.
    series:
      - vending-machine-series-1-blue
      - vending-machine-series-2-red
      - vending-machine-series-3-green

  neo:
    name: Neo Era
    description: The Japanese neo era of 2000 and 2001, which brought the Generation
      II Pokémon to the card game. It has four main expansions, from Gold, Silver,
      to a New World... to Darkness, and to Light..., and they became the English
      Neo Genesis, Neo Discovery, Neo Revelation and Neo Destiny. The era introduced
      a new card layout with a round Evolution box, and the Darkness and Metal
      types. Intro Pack Neo, a pair of half decks, sits alongside the expansions.
    series:
      - gold-silver-to-a-new-world
      - crossing-the-ruins
      - awakening-legends
      - darkness-and-to-light
      - intro-pack-neo

  vs:
    name: VS Era
    description: The Japanese VS era of 2001, a short run of products between the
      neo expansions and Pokémon Web. Its only main expansion is Pokémon Card VS,
      which has no English equivalent and introduced a new card layout and a
      numbered card order. Around it sit a half deck released in cinemas and a set
      tied to the Tropical Mega Battle tournament, both made from Pokémon VS cards.
    series:
      - leaders-pokemon-movie-limited-edition
      - pokemon-vs
      - tropical-mega-battle

  web:
    name: Web Era
    description: The Japanese web era, which has a single expansion released in
      October 2001 and sold only online through the Pokémon Center. Pokémon Web
      reprints cards from the first four Japanese expansions with updated rules text
      and the card design of Pokémon VS. It has no English equivalent.
    series:
      - pokemon-web

  ecard:
    name: e-Card Era
    description: The Japanese e-Card era ran from December 2001 to October 2002 and
      produced five main expansions, starting with Base Expansion Pack and ending
      with Mysterious Mountains. The cards have an enlarged left and bottom border
      that holds a dot code, which the Card e Reader could scan for Pokédex data,
      minigames and hidden attacks. Wizards of the Coast later folded the five
      Japanese expansions into three English sets, Expedition Base Set, Aquapolis
      and Skyridge, so the second to fifth Japanese expansions were released in
      pairs that each became one English set. Most sets were printed in both 1st
      Edition and unlimited runs.
    series:
      - base-expansion-pack
      - mcdonalds-pokemon-e-minimum-pack
      - the-town-on-no-map
      - wind-from-the-sea
      - split-earth
      - mysterious-mountains
      - promos

  movies:
    name: Movie Commemorations
    description: Movie products are Japanese-only tie-ins released alongside each
      year's Pokémon film, mostly in July, from the Theater Limited VS Pack in 2002
      to the Movie Commemoration Random Pack in 2009. The early ones are 30-card
      half decks built around the film's Pokémon, their trainers and the film's
      setting, and later years switched to a holofoil card album of eleven or nine
      cards and then to booster packs. None of them received an English release, and
      all were printed only in unlimited runs.
    series:
      - theater-limited-vs-pack
      - movie-commemoration-vs-pack
      - movie-commemoration-vs-pack-sky-splitting-deoxys
      - movie-commemoration-vs-pack-auras-lucario
      - movie-commemoration-vs-pack-seas-manaphy
      - 10th-movie-commemoration-set
      - 11th-movie-commemoration-set
      - movie-commemoration-random-pack

  adv:
    name: ADV Era
    description: The Japanese ADV era began in January 2003 with Expansion Pack,
      introduced the Generation III Pokémon and Pokémon-ex, and ran for four main
      expansions plus the Magma vs Aqua subset, ending with Undone Seal in January
      2004. The cards still carry an e-Reader dot code strip on the bottom border,
      and Magma vs Aqua was the last set to do so. English collectors know the era
      as the first half of the EX series, where the first five EX sets draw on these
      releases. Most sets came as 1st Edition and unlimited prints, and several
      launched alongside constructed starter decks.
    series:
      - adv-promos
      - adv-expansion-pack
      - miracle-of-the-desert
      - rulers-of-the-heavens
      - magma-vs-aqua-two-ambitions
      - undone-seal
      - expansion-pack-starter-decks
      - rulers-starter-decks
      - gift-box
      - play-promos

  pcg:
    name: PCG Era
    description: The Japanese PCG era began in April 2004 with Flight of Legends,
      built on Kanto and the Generation I Pokémon, and ran for ten expansions
      through the World Champions Pack of July 2007. Its sets draw on Kanto, Johto
      and Hoenn, with Pokémon ☆ cards appearing from Rocket Gang Strikes Back onward
      and Delta Species Pokémon from Holon Research Tower. Most were released in
      Japan months before the matching English EX set, though the last one came out
      after English Power Keepers. Beside the main sets the era includes random
      constructed starter decks, deck kits, gift boxes, quick construction packs and
      a long PCG-P promo run.
    series:
      - pcg-promos
      - venusaur-charizard-and-blastoise-random-constructed-starter-decks
      - flight-of-legends
      - clash-of-the-blue-sky
