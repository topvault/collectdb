  dp:
    name: Diamond & Pearl Era
    description: The Diamond & Pearl era of the Japanese Pokémon Card Game ran from
      November 2006 to July 2008 and covered six expansion blocks, from Space-Time
      Creation to Intense Fight in the Destroyed Sky. It introduced Generation IV
      Pokémon and Pokémon LV.X, along with a redesigned card layout that brought the
      Pokédex entry back. Several blocks were released as a pair of twin expansions,
      and the English releases regrouped them as Diamond & Pearl through Stormfront,
      splitting Moonlit Pursuit and Dawn Dash into two sets and combining Cry from
      the Mysterious and Temple of Anger into one. Entry Packs, half decks and deck
      kits accompanied many of the expansions, and the DP-P and Players Club promos
      ran alongside.
    series:
      - entry-pack
      - space-time-creation
      - diamond-and-pearl-promos
      - ppp-promos
      - bastiodon-the-defender-and-rampardos-the-attacker-constructed-half-decks
