  swsh:
    name: Sword & Shield Era
    description: The Sword & Shield era of the Japanese Pokémon Card Game began on
      November 29, 2019 with the V Starter Sets and is based on the Galar region
      games. Its first main expansions, the dual Sword and Shield sets, introduced
      Pokémon V, and later sets added VMAX, the Single Strike, Rapid Strike and
      Fusion Strike styles, VSTAR and Radiant Pokémon. Main expansions often came as
      twin sets, followed by enhanced expansion packs, high class packs and a steady
      flow of starter sets, decks and S-P promos. Paradigm Trigger in October 2022
      was the final main expansion and VSTAR Universe in December 2022 the final
      subset. English sets regrouped the Japanese products, so one English set
      usually combines a main expansion with the subsets and decks that followed it.
