  pl:
    name: Platinum Era
    description: The Platinum era of the Japanese Pokémon Card Game ran from October
      2008 to July 2009 and has four main expansions, from Galactic's Conquest to
      Advent of Arceus. The sets continue with Generation IV Pokémon and Pokémon
      LV.X, and they follow the game Pokémon Platinum. They added Pokémon SP, which
      belong to Team Galactic, the Gym Leaders, the Elite Four, Cynthia and the
      Frontier Brains. Each expansion was released in English one-to-one as
      Platinum, Rising Rivals, Supreme Victors and Arceus. The era also has Entry
      Packs, a gift box, SP deck kits, collection packs, Arceus decks and a Pokémon
      Rumble tie-in set.
    series:
      - platinum-promos
      - galactics-conquest
      - bonds-to-the-end-of-time
      - beat-of-the-frontier
      - advent-of-arceus
      - melee-pokemon-scramble
