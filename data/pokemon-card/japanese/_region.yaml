  sv:
    name: Scarlet & Violet Era
    description: The Scarlet & Violet Era of the Japanese Pokémon Trading Card Game,
      which began on November 18, 2022 with the first SV-P promotional card and
      ended with the Black Bolt and White Flare pair on June 6, 2025, the eleventh
      and final expansion of the era. It is built around Generation IX and the
      Paldea games, with Pokémon ex, the Tera mechanic and later the Ancient and
      Future Paradox cards. Main expansions are joined by enhanced expansion packs
      and High Class Packs, and by starter sets, deck build boxes and special decks
      released alongside them. The English sets of the era usually combine several
      of these Japanese releases, so Scarlet & Violet, Paldea Evolved and Obsidian
      Flames each draw on more than one.
