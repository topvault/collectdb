name: Abyss Eye
description: The fifth expansion of the Japanese MEGA Series, released on May
  22, 2026. It is the first set based on the Mega Dimension DLC, and continues
  to bring in Pokémon ex and Trainer cards from the game. Each pack holds five
  cards. It was first revealed to the public on April 17, 2026, a date said to
  be when Darkrai is active, and its cards are included in the English Pitch
  Black.
