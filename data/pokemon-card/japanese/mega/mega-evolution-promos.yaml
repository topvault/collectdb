name: Mega Evolution Promos
description: The M-P promotional cards of the Japanese MEGA Series, which began
  on August 1, 2025 with 001/M-P in the first MEGA Series Pokémon Card Gym Promo
  Card Pack. Every promo of the series carries the suffix M-P and the word PROMO
  in place of an expansion code. Equivalent M-P cards were also available in
  other Asian languages, including Traditional Chinese, Thai, Indonesian and
  Korean. Some were handed out in the Traditional Chinese 10-Pack Set Plus of
  Inferno X and Nihil Zero.
releaseDate: '2025-08-01'
