name: World Collection
description: The World Collection (Pikachu World), a box of nine Holofoil
  Pikachu cards with gold Holofoil borders, one in each of the nine languages
  the card game was printed in at the time (English, Italian, Korean, Spanish,
  Japanese, German, French, Polish and Portuguese). Each card has its own
  artwork for its country, except the Japanese one, which uses stock artwork.
  The cards are unnumbered. It was released on July 8, 2010 alongside Clash at
  the Summit, in a blue box sold at Pokémon Centers and a green box sold only at
  7-Eleven stores. The two hold the same cards except the Japanese Pikachu,
  which has a green background in the 7-Eleven box. The English release followed
  in November 2010 and differs only in its card backs.
