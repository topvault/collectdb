additional:
  make-ready:
    name: Make-Ready Test Prints
    description: >-
      Make-ready sheets are run through the press to set the plates and ink
      before a print run. These are 2020 basic Energy cards from those sheets.
      Each copy carries only some of the ink layers, often just the yellow, so
      copies of the same Energy can look quite different. CGC labels them
      "Make-Ready" Test Print and files them under Unnumbered Energy Cards.
