name: Pokémon Futsal 2020
description: A small promotional collection of five Futsal-themed Pokémon cards,
  with the Pikachu, Eevee, Grookey and Scorbunny on the Ball cards among them.
  It came from the partnership between The Pokémon Company International and the
  English Football Association to increase participation in futsal, and the
  cards were handed out from September 11, 2020. Four of the five were gifts
  with purchase through a retailer, and the fifth was included in kit bundles
  sent to selected applicants of The FA Pokémon Youth Futsal Programme for the
  2020-21 season.
