name: Play! Prize Pack Nine
description: Play! Prize Pack Series Nine, released on July 1, 2026 through
  Organized Play events and affiliated products. It gathers selected cards from
  Journey Together through Perfect Order, including the MEE Basic Energies.
  Cards keep their original set numbers and carry the Play! Pokémon logo, and
  each booster pack holds 6 cards. Foils use Cosmos Holofoil, except Pokémon ex,
  which keep their regular foil patterns.
