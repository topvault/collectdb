name: 30th Celebration Battle Decks
description: Two preconstructed 60-card decks released together on October 30,
  2026, led by Espeon ex and Umbreon ex for the day and night themes of the
  Pokémon 30th Anniversary. Apart from each deck's ex card and its MEP Promo, an
  illustration rare-style Victini or Zeraora, every card is a Reverse Holo
  reprint with a 30th Anniversary stamp, in the Reverse Holo pattern of its
  original print. They hold the only Reverse Holo printings of 30th Celebration
  cards. The decks are the international counterpart of the Japanese 30th
  Celebration Premium Deck Set Espeon & Umbreon.
releaseDate: '2026-10-30'
