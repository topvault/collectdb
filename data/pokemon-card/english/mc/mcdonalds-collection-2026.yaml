name: McDonald's Collection 2026
description: >-
  The McDonald's Collection 2026, handed out in Happy Meals from November 2026
  to February 2027, starting on November 3, 2026 in Canada and reaching the
  United States on November 10. Each Happy Meal held a two-card booster pack and
  a miniature Happy Meal box toy, in boxes themed after Pikachu, Umbreon or
  Torchic. In Québec the Happy Meal held a four-card French booster pack and
  sticker sheets instead of the toy. The cards come from the Scarlet & Violet
  and Mega Evolution Series, some printed in a confetti holofoil pattern.
