name: World Collection
description: The World Collection, a box of nine Holofoil Pikachu cards with
  gold Holofoil borders, one in each of the nine languages the card game was
  printed in at the time (English, Italian, Korean, Spanish, Japanese, German,
  French, Polish and Portuguese). Each card has its own artwork for its country,
  except the Japanese one, which uses stock artwork. The cards are unnumbered.
  The English box came out in November 2010 with one of the four 2010 World
  Championship Decks, after the Japanese release on July 8, 2010, and its cards
  differ from the Japanese ones only in their card backs. It is not the Pikachu
  World Collection of 2000, which reprinted earlier Pikachu cards.
links:
