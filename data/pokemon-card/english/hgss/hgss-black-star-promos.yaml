  misc-promos:
    name: Misc Promos
    items:
      zoroark-and-legendary-pokemon:
        name: 'Zoroark and Legendary Pokémon'
        variant:
          name: Jumbo
        description: >-
          A Cosmos Holo jumbo card from the World of Illusions Box, released in
          late February 2011 alongside Call of Legends. The card was only ever
          printed as a jumbo.
        details:
          illustrator: Kouki Saitou
          rarity: Promo
        integrations:
          pokumon: zoroark-and-legendary-pokemon-world-of-illusions-box-2011-unnumbered
        id: 26fcbf2f-3c00-45d3-88a7-9d0a5d22dc97
        remark: promo-generic
      zorua-and-celebi:
        name: Zorua and Celebi
        variant:
          name: Jumbo
        description: >-
          A Cosmos Holo jumbo card given to people attending screenings of
          Zoroark: Master of Illusions on the Pokémon Black and White Sampling
          Tour, which ran on weekends from February 5 to March 20, 2011. The
          card was only ever printed as a jumbo.
        details:
          illustrator: Kagemaru Himeno
          rarity: Promo
        integrations:
          pokumon: zorua-and-celebi-zoroark-master-of-illusions-theatrical-screening-2011-unnumbered
        id: a7ac7b20-0dad-414f-91ea-28478c61402b
        remark: promo-generic
