name: English
generations:
  base:
    name: Base
    description: The original English run of the Pokémon Trading Card Game,
      published by Wizards of the Coast from the Base Set in January 1999 to Team
      Rocket in April 2000. Base Set 2 reprinted earlier cards in between, and a
      numbered series of Black Star promos ran alongside. Every set features the
      Generation I Pokémon. The four main sets follow Japan's Expansion Pack,
      Jungle, Mystery of the Fossils and Rocket Gang, released between 1996 and
      1997, and were printed in both 1st Edition and Unlimited runs.
    series:
      - base-set
      - jungle
      - fossil
      - team-rocket
      - wizards-black-star-promos
      - base-set-2

  gym:
    name: Gym
    description: Two sets built around the Kanto Gym Leaders and their Pokémon,
      released by Wizards of the Coast in 2000, Gym Heroes in August and Gym
      Challenge in October. They are the English versions of Japan's Leaders'
      Stadium and Challenge from the Darkness from 1998 and 1999, and each English
      set combines cards from both Japanese expansions. Both were printed in 1st
      Edition and Unlimited runs, and they still feature the Generation I Pokémon.
    series:
      - gym-heroes
      - gym-challenge

  neo:
    name: Neo
    description: The Neo era brought the Generation II Pokémon to the English game,
      with four main expansions released by Wizards of the Coast from Neo Genesis in
      December 2000 to Neo Destiny in February 2002. Each follows its Japanese Neo
      Era set by several months. Two special products sit beside them, the Southern
      Islands Collection and the VS Decks from the Tropical Mega Battle. The main
      expansions were printed in 1st Edition and Unlimited runs.
    series:
      - neo-genesis
      - neo-discovery
      - southern-islands
      - tropical-mega-battle
      - neo-revelation
      - neo-destiny

  lc:
    name: Legendary Collection
    description: The Legendary Collection era is a single main expansion, released
      in English on May 24, 2002 and made up of reprints from the four original
      sets. It has no Japanese main expansion as an equivalent. Energize Your Game,
      a small set of energy promotional cards, is listed with it.
    series:
      - energize-your-game
      - legendary-collection

  ecard:
    name: e-Card
    description: The e-Card era ran from September 2002 to May 2003 in English and
      covers three main expansions, Expedition Base Set, Aquapolis and Skyridge. Its
      cards carry a Dot Code strip along the edge that the Nintendo e-Reader could
      scan. The Japanese e-Card Era had five expansions, which the English sets
      combined, two Japanese expansions to each of Aquapolis and Skyridge. Skyridge
      was the last expansion Wizards of the Coast produced, and a promotional
      collection called Best of game closed out their run.
    series:
      - expedition-base-set
      - best-of-game
      - aquapolis
      - skyridge

  ex:
    name: EX
    description: The EX era covers sixteen main expansions released in English from
      EX Ruby & Sapphire in June 2003 to EX Power Keepers in February 2007,
      introducing the Generation III Pokémon and the stronger Pokémon-ex. It was
      made by Pokémon USA after Wizards of the Coast lost the license, with Nintendo
      of America handling consumer marketing and distribution until the end of 2005.
      The English sets usually follow Japan's ADV and PCG Era expansions by several
      months, and EX Emerald has no Japanese main expansion as an equivalent. Later
      sets add mechanics such as Pokémon ☆ and Delta Species, and English cards are
      available as Reverse Holos.
    series:
      - ruby-and-sapphire
      - nintendo-black-star-promos
      - sandstorm
      - dragon
      - team-magma-vs-team-aqua
      - hidden-legends
      - poke-card-creator-pack
      - firered-and-leafgreen
      - team-rocket-returns
      - deoxys
      - emerald
      - unseen-forces
      - delta-species
      - legend-maker
      - holon-phantoms
      - crystal-guardians
      - dragon-frontiers
      - power-keepers

  pop:
    name: Pokemon Organized Play (POP)
    description: Pokémon Organized Play promotional boosters, nine numbered POP
      Series sets released between 2004 and 2009. Each was handed out through
      leagues and sanctioned events, and later turned up in value packs, tins and
      other promotional products. The sets run from the EX era through the DP era
      and into the Platinum era, so their card pools follow whatever was current at
      the time. Packs began with 2 cards, and POP Series 8 raised that to 3 by
      adding an Energy card.
    series:
      - pop-series-1
      - pop-series-2
      - pop-series-3
      - pop-series-4
      - pop-series-5
      - pop-series-6
      - pop-series-7
      - pop-series-8
      - pop-series-9

  tk:
    name: Trainer Kit
    description: Half deck kits that teach new players the game, each pairing two
      30-card half decks around a featured Pokémon, with rulebook, coin and a code
      card or booster depending on the era. The line starts with the EX Trainer Kit
      in 2004 and continues through the Diamond & Pearl, HeartGold & SoulSilver,
      Black & White, XY and Sun & Moon kits until 2018. The cards carry
      kit-exclusive collection numbers and set symbols and have no rarity symbols,
      except for the Sun & Moon kit of June 2018, which uses direct reprints with
      their original numbers. Most contents are reprints.
    series:
      - ex-trainer-kit-latias
      - ex-trainer-kit-latios
      - ex-trainer-kit-2-minun
      - ex-trainer-kit-2-plusle
      - dp-trainer-kit-lucario
      - dp-trainer-kit-manaphy
      - hs-trainer-kit-gyarados
      - hs-trainer-kit-raichu
      - hs-trainer-kit-zoroark
      - hs-trainer-kit-excadrill
      - xy-trainer-kit-sylveon
      - xy-trainer-kit-noivern
      - xy-trainer-kit-wigglytuff
      - xy-trainer-kit-bisharp
      - xy-trainer-kit-latias
      - xy-trainer-kit-latios
      - xy-trainer-kit-suicune
      - xy-trainer-kit-pikachu-libre
      - sm-trainer-kit-lycanroc
      - sm-trainer-kit-alolan-raichu
      - sm-trainer-kit-alolan-ninetales
      - sm-trainer-kit-alolan-sandslash

  dp:
    name: Diamond & Pearl
    description: The Diamond & Pearl Series, released in English from May 2007 to
      November 2008 and made up of seven main expansions plus a numbered run of
      promos. It is the first series to feature Generation IV Pokémon and it
      introduced Pokémon LV.X, a level-up card that can use the attacks and
      abilities of its earlier form. The first three sets follow Japan's Space-Time
      Creation, Secret of the Lakes and Shining Darkness in order. After that the
      English releases split or combine Japanese sets, with Great Encounters and
      Majestic Dawn dividing the Moonlit Pursuit and Dawn Dash expansions and
      Legends Awakened combining two Japanese sets into one.
    series:
      - diamond-and-pearl
      - dp-black-star-promos
      - mysterious-treasures
      - secret-wonders
      - great-encounters
      - majestic-dawn
      - legends-awakened
      - stormfront

  pl:
    name: Platinum
    description: The Platinum Series, four main expansions released in English
      between February and November 2009, based on Pokémon Platinum and its Sinnoh
      region setting. It follows Japan's DPt era set by set, from Galactic's
      Conquest to Advent of Arceus. The series introduced Pokémon SP, Basic Pokémon
      owned by Team Galactic, Gym Leaders, Elite Four members, Cynthia and the
      Frontier Brains in turn, and the Lost Zone for discarded Pokémon. Pokémon
      Rumble, an English-only special set made alongside the WiiWare game, is filed
      here too.
    series:
      - platinum
      - rising-rivals
      - supreme-victors
      - arceus
      - pokemon-rumble

  hgss:
    name: HeartGold & SoulSilver
    description: The HeartGold & SoulSilver Series, four main expansions released in
      English from February to November 2010, based on Generation II Pokémon and the
      remade Johto games. They run alongside Japan's LEGEND era and introduced
      Pokémon Prime and Pokémon LEGEND, the two-piece card that takes two Prize
      cards when it is knocked out. HeartGold & SoulSilver, Undaunted and Triumphant
      follow the Japanese collections and sets of the same period. Unleashed has no
      main Japanese counterpart and gathers cards left over from those Japanese
      releases and from decks.
    series:
      - heartgold-soulsilver
      - hgss-black-star-promos
      - unleashed
      - undaunted
      - triumphant

  col:
    name: Call of Legends
    description: Call of Legends, a single English expansion released on February 9,
      2011. It was the last expansion of Generation IV before Black & White and has
      no main Japanese equivalent. The set gathers the Legendary Pokémon that had
      appeared as Pokémon LEGEND in the HeartGold & SoulSilver Series, and its
      standing is ambiguous, since it launched as a main expansion with booster
      boxes and theme decks yet kept its own series code.
    series:
      - call-of-legends

  bw:
    name: Black & White
    description: The Black & White Series, released in English from April 2011 to
      November 2013 and built around the Generation V Pokémon of Unova. It runs for
      eleven main expansions, starting with Black & White and ending with Legendary
      Treasures, with the Dragon Vault special expansion and a run of BW Black Star
      Promos alongside. It brought Abilities, Full Art cards and later Pokémon-EX
      and ACE SPEC cards. The English main sets follow the Japanese Black Collection
      and White Collection era, but Emerging Powers has no Japanese main expansion,
      so the English and Japanese set numbering drifts apart from there.
    series:
      - black-and-white
      - bw-black-star-promos
      - emerging-powers
      - noble-victories
      - next-destinies
      - dark-explorers
      - dragons-exalted
      - dragon-vault
      - boundaries-crossed
      - plasma-storm
      - plasma-freeze
      - plasma-blast
      - legendary-treasures

  mc:
    name: McDonald's Collection
    description: Promotional card collections packed into McDonald's Happy Meals,
      with English releases from 2011 to 2025. They are separate from the main
      expansions and carry no main-expansion numbering. Most collections hold twelve
      cards, which are mostly reprints from recent expansions with a new set symbol
      and numbering. Later collections add Confetti Holofoil prints and move from
      one card per toy to packs of four cards, and release dates and formats differ
      by country.
    series:
      - mcdonalds-collection-2011
      - mcdonalds-collection-2012
      - mcdonalds-collection-2014
      - mcdonalds-collection-2015
      - mcdonalds-collection-2016
      - mcdonalds-collection-2017
      - mcdonalds-collection-2018
      - mcdonalds-collection-2019
      - mcdonalds-collection-2021
      - mcdonalds-match-battle-2022
      - mcdonalds-match-battle-2023
      - mcdonalds-dragon-discovery-2024

  xy:
    name: XY
    description: The XY Series, released in English from November 2013 to November
      2016 and built around the Generation VI Pokémon of Kalos. It has twelve main
      expansions from XY to Evolutions, plus the Kalos Starter Set, the Double
      Crisis and Generations special expansions, and XY Black Star Promos. Mega
      Evolution through M Pokémon-EX opens the series, and Ancient Traits and
      Pokémon BREAK follow. The English sets track the Japanese XY and XY BREAK
      eras, with the main sets usually arriving a few months after their Japanese
      counterparts.
    series:
      - kalos-starter-set
      - xy
      - xy-black-star-promos
      - flashfire
      - furious-fists
      - phantom-forces
      - primal-clash
      - double-crisis
      - roaring-skies
      - ancient-origins
      - breakthrough
      - breakpoint
      - generations
      - fates-collide
      - steam-siege
      - evolutions

  sm:
    name: Sun & Moon
    description: The Sun & Moon Series, released in English from February 2017 to
      November 2019 and based on the Generation VII games, with Generation I Pokémon
      returning in the later sets. Twelve main expansions run from Sun & Moon to
      Cosmic Eclipse, and each one combines one or two Japanese expansions with
      subsets and starter products, so English sets are usually larger than their
      Japanese counterparts. Special expansions such as Shining Legends, Dragon
      Majesty, Detective Pikachu and Hidden Fates sit between them and were sold
      mainly through set-related merchandise. The era introduced Pokémon-GX, Prism
      Star cards and TAG TEAM Pokémon-GX, and Japanese 1st edition cards were no
      longer printed from this period.
    series:
      - sun-and-moon
      - sm-black-star-promos
      - guardians-rising
      - burning-shadows
      - shining-legends
      - crimson-invasion
      - ultra-prism
      - forbidden-light
      - celestial-storm
      - dragon-majesty
      - lost-thunder
      - team-up
      - detective-pikachu
      - unbroken-bonds
      - unified-minds
      - hidden-fates
      - cosmic-eclipse

  swsh:
    name: Sword & Shield
    description: The Sword & Shield Series, released in English from February 2020
      to January 2023 and based on the Generation VIII games. It runs through twelve
      main expansions from Sword & Shield to Silver Tempest, and the mechanics move
      from Pokémon V and VMAX through the Single Strike, Rapid Strike and Fusion
      Strike styles to Pokémon VSTAR, Radiant Pokémon and Trainer Gallery subsets.
      Special expansions such as Champion's Path, Shining Fates, Celebrations,
      Pokémon GO and Crown Zenith were sold mainly through set-related products.
      English sets usually combine a Japanese expansion with subsets and leftover
      cards, and the Fairy type was retired at the start of the series.
    series:
      - sword-and-shield
      - swsh-black-star-promos
      - rebel-clash
      - darkness-ablaze
      - pokemon-futsal-2020
      - champions-path
      - vivid-voltage
      - shining-fates
      - battle-styles
      - chilling-reign
      - evolving-skies
      - celebrations
      - fusion-strike
      - brilliant-stars
      - astral-radiance
      - pokemon-go
      - lost-origin
      - silver-tempest
      - crown-zenith

  sv:
    name: Scarlet & Violet
    description: The Scarlet & Violet Series, which began in English in March 2023
      with the Generation IX games and runs through Destined Rivals, the tenth and
      final main expansion, with Black Bolt and White Flare as the final special
      expansion. It introduced Pokémon ex and Tera Pokémon ex, the Paradox, Ancient
      and Future cards, ACE SPEC cards and Stellar Tera Pokémon ex, then Trainer's
      Pokémon. The series changed the card design, replacing expansion symbols with
      expansion codes and moving from yellow to gray borders. English main sets
      again combine several Japanese expansions, and special expansions such as 151,
      Paldean Fates, Shrouded Fable and Prismatic Evolutions sit between them. Basic
      Energy cards were issued as their own SVE set.
    series:
      - '151'
      - scarlet-and-violet
      - sve-basic-energies
      - svp-black-star-promos
      - paldea-evolved
      - obsidian-flames
      - paradox-rift
      - paldean-fates
      - temporal-forces
      - twilight-masquerade
      - shrouded-fable
      - stellar-crown
      - surging-sparks
      - prismatic-evolutions
      - journey-together
      - destined-rivals
      - black-bolt
      - white-flare

  energy:
    name: Yearly Energies
    description: Yearly sets of basic Energy cards in English, running from Energies
      2005 to Energies 2022. Each set holds one card per Energy type, six types in
      the first two years and eight or nine in later ones, as Darkness, Metal and
      Fairy Energy joined the game. The sets reprint the same simple cards with new
      artwork and finishes, and holo, Sheen Holo, Mirror Holo and promotional
      variants are what separate one print run from another.
    series:
      - energies-2005
      - energies-2006
      - energies-2007
      - energies-2009
      - energies-2010
      - energies-2011
      - energies-2013
      - energies-2017
      - energies-2019
      - energies-2020
      - energies-2022

  battle:
    name: Battle Decks
    description: Beginner decks and battle kits released in English from 2004 to
      2024. They include the EX Battle Decks, the three Battle Academy kits, the
      commemorative TCG Classic and the young-player My First Battle. Most of their
      cards are reprints from main expansions, often marked or numbered to suit the
      product, and a few cards are exclusive to a kit.
    series:
      - ex-battle-decks
      - battle-academy-2020
      - battle-academy-2022
      - my-first-battle
      - tcg-classic
      - battle-academy-2024

  play:
    name: Play! Prize Packs
    description: The Play! Pokémon Prize Packs, a series of eight promotional card
      sets handed out through Pokémon Organized Play events and affiliated products,
      released from November 2022 to January 2026. Each one gathers cards from
      recent Standard-legal expansions and keeps the original set numbers, marked
      with the Play! Pokémon logo. Every set comes in a standard print and a foil
      print.
    series:
      - play-prize-pack-one
      - play-prize-pack-two
      - play-prize-pack-three
      - play-prize-pack-four
      - play-prize-pack-five
      - play-prize-pack-six
      - play-prize-pack-seven
      - play-prize-pack-eight

  wcd:
    name: World Championship Decks
    description: The World Championships Decks, published in English from 2004 to
      2023. Each year has four decks, each named for a deck that a World
      Championships player used, and the cards inside are reprints of cards from
      ordinary expansions. Cards from these decks are for collecting and casual
      play, since World Championships deck cards are not tournament legal.
    series:
      - wcd-2004
      - wcd-2005
      - wcd-2006
      - wcd-2007
      - wcd-2008
      - wcd-2009
      - wcd-2010
      - wcd-2011
      - wcd-2012
      - wcd-2013
      - wcd-2014
      - wcd-2015
      - wcd-2016
      - wcd-2017
      - wcd-2018
      - wcd-2019
      - wcd-2022
      - wcd-2023
  mega:
    name: Mega Evolution
    description: The Mega Evolution Series of the Pokémon Trading Card Game, whose
      first main expansion reached English on September 26, 2025. It brings Mega
      Evolution back to the game as Mega Evolution Pokémon ex cards worth 3 Prize
      cards, and its sets draw on Japanese expansions such as Mega Brave, Mega
      Symphonia and Inferno X. The series also includes special expansions such as
      Ascended Heroes and 30th Celebration, along with Black Star promos and Energy
      cards.
    series:
      - mega-evolution
      - basic-energies
      - black-star-promos
      - phantasmal-flames
      - ascended-heroes
      - perfect-order
      - chaos-rising
      - pitch-black
      - 30th-celebration
