name: Venusaur Starter Set VMAX
description: A Korean Starter Set VMAX from the Sword & Shield era, built around
  Venusaur V and Venusaur VMAX and released in Korea on 13 January 2021. It is
  the Korean printing of Japan's Venusaur Starter Set VMAX, which came out on 4
  December 2020 together with a Blastoise counterpart. The Japanese original is
  a ready-to-play 60-card deck packaged with a coin, a damage counter and marker
  sheet, a playmat and a player's guide. The cards are numbered to a printed
  total of 21, and their English versions were folded into Shining Fates.
