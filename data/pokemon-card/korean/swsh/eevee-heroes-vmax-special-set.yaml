name: Eevee Heroes VMAX Special Set
description: A Korean box product from the Sword & Shield era, released in Korea
  on 28 July 2021 as the Korean printing of Japan's Eevee Heroes VMAX Special
  Set, which came out on 28 May 2021. It contains eight Eevee Heroes booster
  packs and a VMAX promo pack. The promo pack holds one of four Pokémon VMAX,
  Flareon, Vaporeon, Jolteon or Espeon, along with three matching Energy cards.
  These four Eeveelutions have no VMAX card in the main Eevee Heroes set, and
  the promo cards are numbered to a printed total of 4.
