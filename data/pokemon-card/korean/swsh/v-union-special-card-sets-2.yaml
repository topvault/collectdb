name: V-UNION Special Card Sets
description: A Korean special card set from the Sword & Shield era, built around
  Zacian V-UNION and released in Korea on 15 October 2021. It is the Korean
  printing of the Zacian set from Japan's V-UNION Special Card Sets, which came
  out on 20 August 2021 and introduced Pokémon V-UNION. Each of these Pokémon is
  made up of four separate cards that are played together. The set includes the
  four Zacian V-UNION parts along with a Professor Burnet Supporter card that
  helps bring them into play. The numbered cards across the V-UNION sets add up
  to a printed total of 13.
