name: Fusion Arts
description: The Korean printing of Japan's Fusion Arts, the eighth main
  expansion of the Sword & Shield era, which came out in Japan on 24 September
  2021 and reached Korea in December 2021. It has a printed total of 100 cards,
  with secret cards numbered above that. The set introduces the Fusion Strike
  style next to Single Strike and Rapid Strike, and Mew leads it as both a
  Pokémon V and a VMAX. Its English counterpart is Fusion Strike, a 284-card set
  that combined this expansion with cards drawn from other products.
