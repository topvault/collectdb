name: 25th Anniversary Golden Box
description: A premium Korean product from the Sword & Shield era, released on
  12 November 2021 as the Korean printing of Japan's 25th Anniversary Golden
  Box, which came out in Japan in December 2021. Made to accompany the 25th
  Anniversary Collection, it holds a 60-card Pikachu deck in which every card is
  holofoil, plus gold accessories including 64 sleeves, a playmat, 12 metal
  damage counter dice, metal markers, a coin and three leather-like cases. Most
  cards reprint Sword & Shield cards with a 25th anniversary graphic and their
  own numbering, to a printed total of 15. Two entirely gold Full Art cards
  include a Pikachu.
