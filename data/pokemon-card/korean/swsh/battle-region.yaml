name: Battle Region
description: The Korean printing of Japan's Battle Region, the ninth enhanced
  expansion pack of the Sword & Shield era, which came out in Japan on 25
  February 2022 and reached Korea on 27 April 2022. It has a printed total of 67
  cards, with secret cards numbered above that. Hisui region Pokémon from
  Pokémon Legends Arceus, such as Wyrdeer and Kleavor, appear throughout.
  Radiant Pokémon debuted here with a Pixel Crosshatch holofoil and a K rarity,
  and the set also adds Character Rare Full Art cards. Its cards were later
  split between the English Astral Radiance and Lost Origin.
releaseDate: '2022-04-27'
printedTotal: 67
integrations:
  pokemonKorea: 소드&실드 강화 확장팩 「배틀리전」
links:
