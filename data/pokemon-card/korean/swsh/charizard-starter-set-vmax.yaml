name: Charizard Starter Set VMAX
description: A Korean deck product from the Sword & Shield era, released in
  Korea on 22 May 2020 as the Korean printing of Japan's Charizard Starter Set
  VMAX, which came out on 27 March 2020. The deck is built around Charizard V
  and Charizard VMAX, and its cards are numbered to a printed total of 21. In
  Japan it was a ready-to-play 60-card deck with a damage counter and marker
  sheet, a coin, a playmat and a player's guide. Its partner deck was the
  Grimmsnarl Starter Set VMAX, and the cards of both later went into the English
  Darkness Ablaze set.
