name: Single Strike Master
description: The Korean printing of Japan's Single Strike Master, released in
  Korea on 24 February 2021. The Japanese original came out on 22 January 2021
  as one half of a paired release with Rapid Strike Master, together forming the
  fifth main expansion of the Sword & Shield era. The pair brought the Single
  Strike and Rapid Strike battle styles to the card game for the first time, and
  this half features Urshifu. It has a printed total of 70 cards, with secret
  cards numbered above that. Its English counterpart is Battle Styles, which
  drew on both Japanese sets.
