name: VSTAR Special Set
description: The Korean printing of Japan's VSTAR Special Set, the third Special
  Set of the Sword & Shield era, released in Korea on 23 September 2022. In
  Japan it came out on 5 August 2022 with eight Lost Abyss packs, an acrylic
  VSTAR marker and a pack of promo cards. That pack holds one of three pairs,
  Rotom V and VSTAR, Zacian V and VSTAR, or Zamazenta V and VSTAR, for a printed
  total of 6. Zamazenta V is an alternate art version of its Start Deck 100
  card, and the rest are new. Crown Zenith later carried them in English.
