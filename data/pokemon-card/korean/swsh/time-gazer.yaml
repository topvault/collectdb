name: Time Gazer
description: The Korean printing of Japan's Time Gazer, released in Korea on 20
  May 2022. The Japanese original came out on 8 April 2022 as one half of a
  paired release with Space Juggler, the tenth main expansion of the Sword &
  Shield era. It has a printed total of 67 cards, and secret cards are numbered
  above that. With its partner set it carries on the VSTAR mechanic and focuses
  on Hisui region Pokémon from Pokémon Legends Arceus, such as Dialga, Palkia
  and the Hisuian final evolutions of the first partner Pokémon. Its English
  counterpart is Astral Radiance, which draws on both halves.
releaseDate: '2022-05-20'
