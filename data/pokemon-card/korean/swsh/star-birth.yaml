name: Star Birth
description: The Korean printing of Japan's Star Birth, the ninth main expansion
  of the Sword & Shield era, which came out in Japan on 14 January 2022 and
  reached Korea on 23 February 2022. It has a printed total of 100 cards, and
  secret cards are numbered above that. The set introduces Pokémon VSTAR, which
  evolve from a Pokémon V and have a VSTAR Power that can be used once per game,
  and Arceus is at its center. Its English counterpart is Brilliant Stars, which
  adds cards from Start Deck 100 and VMAX Climax.
releaseDate: '2022-02-23'
printedTotal: 100
