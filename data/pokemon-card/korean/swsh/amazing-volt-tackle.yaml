name: Amazing Volt Tackle
description: The Korean printing of Japan's Amazing Volt Tackle, the fourth main
  expansion of the Sword & Shield era, which came out in Japan on 18 September
  2020 and reached Korea on 21 October 2020. It has a printed total of 100
  cards, and secret cards are numbered above that. Pikachu and Gigantamax
  Pikachu are the focus, and the set introduced Amazing Pokémon, a new kind of
  card. Its English counterpart, Vivid Voltage, combines this set with the
  Legendary Heartbeat subset.
releaseDate: '2020-10-21'
