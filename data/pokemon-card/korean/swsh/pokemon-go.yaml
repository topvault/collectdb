name: Pokémon GO
description: The Korean printing of Japan's Pokémon GO, an enhanced expansion
  pack from the Sword & Shield era that came out in Japan on 17 June 2022 and
  was released in Korea on the same day. The set is built around the mobile
  game. It shows the game's Pokémon in both drawn and photographic artwork, and
  its Trainer cards are based on the game's items, places and characters. Many
  cards carry the Pokémon GO logo and a Niantic copyright. It has a printed
  total of 71, with secret cards numbered above that. The English counterpart
  came out on 1 July 2022 with 88 cards.
releaseDate: '2022-06-17'
