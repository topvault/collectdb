name: 25th Anniversary Collection
description: The Korean printing of Japan's 25th Anniversary Collection, a
  special Sword & Shield era set marking 25 years of the card game. It came out
  in Korea on 22 October 2021, the same day as the Japanese original. It has a
  printed total of 28, with more cards numbered above that, and was sold in
  packs of five foil cards that include a basic Energy. Legendary and Mythical
  Pokémon from across the series appear alongside several Pikachu cards, some
  reworking Original Series ideas with Sword & Shield mechanics, and every card
  bears a blue and gold 25th graphic. Its English counterpart is Celebrations.
releaseDate: '2021-10-22'
printedTotal: 28
