name: Zacian & Zamazenta vs Eternatus Special Deck Set
description: The Korean printing of Japan's Zacian & Zamazenta vs Eternatus
  Special Deck Set, a Sword & Shield era deck kit that came out in Japan on 5
  November 2021 and in Korea on 17 December 2021. It holds two 60-card decks,
  one led by Zacian V and Zamazenta V and the other by Eternatus VMAX. Every
  card is a reprint from earlier Sword & Shield sets, some with new artwork,
  including secret Full Art prints of Zacian V and Zamazenta V. Both decks share
  one set symbol and one numbering, with a printed total of 28.
releaseDate: '2021-12-17'
printedTotal: 28
