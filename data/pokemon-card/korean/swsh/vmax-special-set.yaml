name: VMAX Special Set
description: A boxed set from the Sword & Shield era, released in Korea on 27
  November 2020 as the Korean version of Japan's VMAX Special Set, which came
  out on 23 October 2020. It bundles eight booster packs, one from each
  expansion and enhanced expansion of the era up to that point, with a VMAX
  Promo Card Pack. That pack holds one of four Pokémon VMAX, Dhelmise,
  Cinderace, Morpeko or Cramorant, along with three Energy cards of the same
  type. The promo cards are numbered to a printed total of 4, and in English
  they became part of Shining Fates.
