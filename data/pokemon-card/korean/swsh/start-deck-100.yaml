name: Start Deck 100
description: The Korean printing of Japan's Start Deck 100, a Sword & Shield era
  product that came out in Japan on 17 December 2021 and reached Korea on 23
  April 2022. Each box holds one random 60-card deck, drawn from 100 standard
  decks plus a secret one. Every numbered deck has fixed contents built around
  one to three types and includes at least one Pokémon V. Most cards come from
  the second year of the era, and some reprints carry the F regulation mark in
  place of D. The cards are numbered to a printed total of 414, with secret
  cards above that.
releaseDate: '2022-04-23'
printedTotal: 414
integrations:
  pokemonKorea: 소드&실드 「스타트 덱 100」
links:
  Pokémon Korea: https://pokemoncard.co.kr/card/416
editions:
  reverse-holo:
    name: Reverse Holo
    description: The mirror holofoil version of a card, which the Korean card
      database lists as a card of its own.
    finish: Reverse Holo
  unlimited: Normal
