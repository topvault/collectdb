name: Eevee Heroes
description: The Korean printing of Japan's Eevee Heroes, the sixth enhanced
  expansion pack of the Sword & Shield era, which came out in Japan on 28 May
  2021 and reached Korea on 11 August 2021. It centres on Eevee and the eight
  forms it can evolve into as of Generation VIII, all of which appear as Pokémon
  V. Their matching VMAX cards were sold in separate products. The set has a
  printed total of 69 cards, and secret cards are numbered above that. Packs
  held five cards, and in English its cards were split between Evolving Skies
  and Fusion Strike.
releaseDate: '2021-08-11'
