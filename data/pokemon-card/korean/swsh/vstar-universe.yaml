name: VSTAR Universe
description: The Korean printing of Japan's VSTAR Universe, a high class pack
  that closed out the Sword & Shield era as its last subset. The Japanese
  original came out on 2 December 2022, and the Korean release followed on 13
  January 2023. It has a printed total of 172 cards, with secret cards numbered
  above that. Its English counterpart is Crown Zenith, which combines these
  cards with VSTAR Special Set cards and leftover cards from Paradigm Trigger
  and Incandescent Arcana.
releaseDate: '2023-01-13'
printedTotal: 172
integrations:
  pokemonKorea: 소드&실드 하이클래스팩 「VSTAR 유니버스」
links:
  Pokémon Korea: https://pokemoncard.co.kr/card/506
editions:
  reverse-holo:
    name: Reverse Holo
    description: The mirror holofoil version of a card, which the Korean card
      database lists as a card of its own.
    finish: Reverse Holo
  unlimited: Normal
