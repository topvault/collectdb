name: Start Deck 100 CoroCoro Comic Version
description: The Korean release of Japan's Start Deck 100 CoroCoro Comic
  Version, which came out in Korea on 27 May 2022. The Japanese original
  appeared in March 2022 as a special Start Deck 100 deck sold through CoroCoro
  Comic. It grew out of the magazine's King of Combi illustration contest, which
  the pairing of Pikachu and Eevee won. Those entries became the deck's two
  Pokémon V cards, Pikachu V and Eevee V, both drawn by You Iribi. The Korean
  deck has a printed total of 24 cards.
