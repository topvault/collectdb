name: Blastoise Starter Set VMAX
description: A Korean starter deck from the Sword & Shield era, released in
  Korea on 13 January 2021 as the Korean printing of Japan's Blastoise Starter
  Set VMAX, which came out on 4 December 2020. The ready-to-play 60-card deck is
  built around Blastoise V and Blastoise VMAX. Its cards are numbered to a
  printed total of 20. In English, the cards from this deck were folded into
  Shining Fates.
