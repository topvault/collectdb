name: Legendary Heartbeat
description: The Korean printing of Japan's Legendary Heartbeat, the third
  enhanced expansion pack of the Sword & Shield era, released in Korea on 16
  September 2020. The Japanese original came out on 10 July 2020. Zarude is the
  set's featured Pokémon, and the set introduced the Amazing Rare rarity. It has
  a printed total of 76 cards, and secret cards are numbered above that. Its
  English counterpart is Vivid Voltage, which combines this set's cards with
  those of Amazing Volt Tackle.
