name: Charizard VSTAR vs Rayquaza VMAX Special Deck Set
description: The Korean printing of Japan's Charizard VSTAR vs Rayquaza VMAX
  Special Deck Set, a Sword & Shield era deck kit that came out in Japan on 4
  November 2022 and in Korea on 16 December 2022. It holds two 60-card decks,
  one led by Charizard VSTAR and the other by Rayquaza VMAX, which share one
  numbering with a printed total of 30. Apart from new artwork on the two lead
  Pokémon, every card is reprinted from earlier Sword & Shield sets, and the
  non-power cards have a Mirror Holofoil finish. The Japanese kit also came with
  deck cases, coins, two VSTAR markers, a playmat and guides.
