name: Sword
description: The Korean printing of Japan's Sword, released in Korea on 7
  February 2020. In Japan it came out on 6 December 2019 as one half of the
  paired expansions that opened the Sword & Shield era, and it was the first
  main expansion to feature Pokémon V. The pair draws on Pokémon Sword and
  Shield, showing the Galar region and the legendaries Zacian and Zamazenta. It
  has a printed total of 60 cards, and secret cards are numbered above that.
  These sets also retired the Fairy type, and the English Sword & Shield
  combined both Japanese halves.
