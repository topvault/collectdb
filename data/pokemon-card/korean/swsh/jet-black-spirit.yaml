name: Jet-Black Spirit
description: The Korean printing of Japan's Jet-Black Spirit, released in Korea
  on 4 June 2021. The Japanese original came out on 23 April 2021 as one half of
  the Sword & Shield era's sixth main expansion, alongside Silver Lance.
  Together the two sets feature Calyrex with Glastrier and Spectrier, Pokémon
  from the Sword and Shield Expansion Pass. This set has a printed total of 70
  cards, with secret cards numbered above that. Its English counterpart is
  Chilling Reign, which combines both Japanese sets with the Peerless Fighters
  subset.
