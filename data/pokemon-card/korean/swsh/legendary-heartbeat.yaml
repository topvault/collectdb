name: Legendary Heartbeat
description: The Korean printing of Japan's Legendary Heartbeat, the third
  enhanced expansion pack of the Sword & Shield era, released in Korea on 16
  September 2020. The Japanese original came out on 10 July 2020. The set has a
  printed total of 76 cards, with secret cards numbered above that. Zarude is
  featured, and the set introduced the Amazing Rare rarity. Its cards went into
  the English Vivid Voltage along with those of Amazing Volt Tackle.
