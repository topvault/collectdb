name: V-UNION Special Card Sets
description: The Korean printing of Japan's V-UNION Special Card Sets from the
  Sword & Shield era, released in Korea on 15 October 2021. The Japanese sets
  arrived on 20 August 2021 and introduced Pokémon V-UNION, a single Pokémon
  made from four separate cards played together. The Korean product is the
  Mewtwo V-UNION set, which holds the four parts of Mewtwo V-UNION and a
  Professor Burnet Supporter that helps bring them into play. The V-UNION parts
  carry their own numbers, and the full run across Greninja, Mewtwo and Zacian
  has a printed total of 13.
