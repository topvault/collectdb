name: Sword & Shield Family Pokémon Card Game
description: A Korean beginner product from the Sword & Shield era, released on
  27 November 2021 as the Korean printing of Japan's Family Pokémon Card Game,
  which came out on 9 July 2021. Made for children and families, it holds three
  60-card decks led by Cinderace V, Pikachu V and Tyranitar V, and each deck
  combines two types and uses simple card effects. Battle guides, a playmat,
  deck bands and damage counters come with the decks, and some cards have
  teaching numbers that match the guides. The cards are numbered to a printed
  total of 53.
