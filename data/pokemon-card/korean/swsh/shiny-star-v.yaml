name: Shiny Star V
description: The Korean printing of Japan's Shiny Star V, a high class pack from
  the Sword & Shield era that came out in Japan on 20 November 2020 and reached
  Korea on 18 December 2020. It has a printed total of 190, with secret cards
  numbered above that. Many Pokémon V and VMAX return, some with artwork earlier
  seen only in English sets or on merchandise. The secret cards include a large
  number of embossed Shiny Pokémon, all of them reprints. Its English
  counterpart is Shining Fates, which combines this set with the Venusaur and
  Blastoise VMAX starter sets and the VMAX Special Set.
releaseDate: '2020-12-18'
