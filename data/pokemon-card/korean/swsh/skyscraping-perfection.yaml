name: Skyscraping Perfection
description: The Korean printing of Japan's Skyscraping Perfection, released in
  Korea on 8 September 2021 after the Japanese original came out on 9 July 2021.
  In Japan it was half of a dual expansion with Blue Sky Stream, together
  forming the seventh main expansion of the Sword & Shield era. The set has a
  printed total of 67, with secret cards numbered above that. Dragon-type
  Pokémon return to the game, with Rayquaza and Duraludon as Pokémon V and VMAX,
  and the Eeveelutions also appear. Its English counterpart is Evolving Skies,
  which drew on both halves of the pair.
