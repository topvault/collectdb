name: Sword & Shield Premium Trainer Box
description: The Korean edition of Japan's Sword & Shield Premium Trainer Box,
  which launched in Japan on 6 December 2019 together with the Sword and Shield
  expansions and reached Korea on 2 May 2020. In the Japanese original, booster
  packs of both Sword and Shield come with a deck-building selection of Trainer
  cards, special Energy and basic Energy, drawn from both the Sword & Shield and
  Sun & Moon eras. Extras include premium poison and burn markers, acrylic
  damage counters with a case and a Pokémon V coin. Premium Trainer Boxes like
  this one became the standard launch product for each new regulation block. The
  Korean cards are numbered to a printed total of 24.
releaseDate: '2020-05-02'
printedTotal: 24
