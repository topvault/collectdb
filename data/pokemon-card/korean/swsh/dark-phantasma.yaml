name: Dark Phantasma
description: The Korean printing of Japan's Dark Phantasma, the tenth enhanced
  expansion pack of the Sword & Shield era, released in Japan on 13 May 2022 and
  in Korea on 22 July 2022. It has a printed total of 71 cards, and secret cards
  are numbered above that. Following Time Gazer and Space Juggler, it brings
  more Hisui region Pokémon, led by Hisuian Zoroark as a Pokémon V, a Pokémon
  VSTAR and a regular evolution line. It also adds more Radiant Pokémon and
  Character Rare Full Art cards, and its commons and uncommons have Mirror
  Holofoil versions. Its cards went into the English Lost Origin.
releaseDate: '2022-07-22'
printedTotal: 71
integrations:
  pokemonKorea: 소드&실드 강화 확장팩 「다크판타스마」
links:
  Pokémon Korea: https://pokemoncard.co.kr/card/447
editions:
  reverse-holo:
    name: Reverse Holo
    description: The mirror holofoil version of a card, which the Korean card
      database lists as a card of its own.
    finish: Reverse Holo
  unlimited: Normal
