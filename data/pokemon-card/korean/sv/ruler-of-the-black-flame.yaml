name: Ruler of the Black Flame
description: The Korean printing of Japan's Ruler of the Black Flame, released
  in Korea on 25 August 2023. The Japanese original came out on 28 July 2023 as
  the third main expansion of the Scarlet & Violet era, and its English
  counterpart is Obsidian Flames. The set has a printed total of 108, with
  secret cards numbered beyond that. It and Obsidian Flames were the first sets
  to include Tera Pokémon ex shown in a type other than their usual one. These
  cards keep their normal attack Energy costs but take a Weakness and Resistance
  that match the new type.
releaseDate: '2023-08-25'
