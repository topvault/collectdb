name: Battle Partners Deck Build Box
description: A Korean deck build box from the Scarlet & Violet era, released in
  Korea on 28 March 2025 as the Korean printing of Japan's Battle Partners Deck
  Build Box. The Japanese original came out on 24 January 2025 alongside the
  Battle Partners expansion. In Japan it held 10 Battle Partners packs and a
  fixed set of 171 cards, made up of Pokémon, Trainers, Special Energy and Basic
  Energy. Four dividers pair featured Trainers with their Pokémon ex, namely Hop
  and Zacian, Lillie and Clefairy, N and Zoroark, and Iono and Bellibolt. Its
  cards carry a printed total of 45.
