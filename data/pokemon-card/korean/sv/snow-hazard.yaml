name: Snow Hazard
description: The Korean printing of Japan's Snow Hazard, released in Korea on 14
  June 2023 as a Scarlet & Violet expansion pack. The Japanese original came out
  on 14 April 2023 together with Clay Burst, and the two halves made up the
  second main expansion of the Scarlet & Violet era. Chien-Pao, one of the
  treasures of ruin, appears as a Pokémon ex, and more Pokémon and characters
  from the Paldea games make their debut. The set has a printed total of 71,
  with secret cards numbered beyond that. In English its cards were merged with
  Triplet Beat and Clay Burst into Paldea Evolved.
