name: Scarlet ex
description: The Korean printing of Japan's Scarlet ex, released in Korea on 15
  March 2023 as one half of the first main expansion of the Scarlet & Violet
  era. The Japanese original came out on 20 January 2023 with its partner set
  Violet ex. Together the two introduced the era's Pokémon ex and the first
  Generation IX Pokémon, with Koraidon and Miraidon at the centre. Some Pokémon
  ex use the new Tera mechanic. The set has a printed total of 78, with secret
  cards numbered beyond that, and in English both halves were combined with
  three ex Starter Sets to make Scarlet & Violet.
