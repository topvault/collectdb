name: Crimson Haze
description: The Korean printing of Japan's Crimson Haze, released in Korea on
  24 May 2024 as an enhanced expansion pack of the Scarlet & Violet era. The
  Japanese original, the fifth Scarlet & Violet subset, came out on 22 March
  2024. Its cards bring in Pokémon and characters from Kitakami, the setting of
  The Teal Mask, with Bloodmoon Ursaluna at the centre, and ACE SPEC cards carry
  on from earlier sets. The printed total is 66, with secret cards numbered
  beyond it, and in English these cards became part of Twilight Masquerade.
releaseDate: '2024-05-24'
printedTotal: 66
