name: 'Battle Master Deck: Terastal Charizard ex'
description: A Korean deck product from the Scarlet & Violet era, released on 5
  July 2024 under the Battle Master Deck name. It is built around Terastal
  Charizard ex. Its cards are numbered to a printed total of 21. No Japanese
  product of the same name is known, so it may have been made only for the
  Korean market.
