name: Scarlet & Violet Promos
description: The Korean run of SV-P promotional cards from the Scarlet & Violet
  era, matching the Japanese SV-P promos that began on November 18, 2022. Like
  the Japanese originals, each card carries the SV-P suffix in its number and
  the word PROMO where an expansion code would normally appear. Equivalent SV-P
  promos were also issued in other Asian languages, including Traditional
  Chinese, Thai and Indonesian.
