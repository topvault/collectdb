name: ex Special Set
description: A Korean boxed product from the Scarlet & Violet era, released in
  Korea on 22 April 2023 as the Korean printing of Japan's ex Special Set, which
  came out on 19 May 2023. In Japan it was the first Special Set of the era and
  the fourth in that line, with four packs each of Snow Hazard and Clay Burst
  plus a promo pack. The promo pack gives one of three evolution lines, ending
  in Toedscruel ex, Pawmot ex or Houndstone ex. The ex cards are new, and the
  earlier stages are Mirror Holofoil reprints from Violet ex. The cards have
  their own set symbol and a printed total of 7.
