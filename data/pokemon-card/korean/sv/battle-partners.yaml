name: Battle Partners
description: The Korean printing of Japan's Battle Partners, released in Korea
  on 21 March 2025 as a Scarlet & Violet expansion pack. The Japanese original
  was the ninth expansion of the era and came out on 24 January 2025. Its cards
  later became part of the English Journey Together. The set has a printed total
  of 100, with secret cards numbered beyond that. It brings back Trainer's
  Pokémon, a mechanic first seen in Gym Heroes, and the Japanese pack art pairs
  N with Zoroark, Lillie with Clefairy, Hop with Zacian and Iono with Bellibolt.
releaseDate: '2025-03-21'
