name: White Flare
description: The Korean printing of Japan's White Flare, released in Korea on 1
  August 2025. The Japanese original came out on 6 June 2025 alongside Black
  Bolt, and the two halves together made up the eleventh and final expansion of
  the Scarlet & Violet era there. The pair draws on Generation V and the Unova
  region, and this half is themed around Reshiram. Its cards carry a printed
  total of 86, with secret cards numbered beyond that. The set brings back
  Tinsel Holofoil cards and introduces the BWR rarity, which goes to a single
  card in the set.
releaseDate: '2025-08-01'
