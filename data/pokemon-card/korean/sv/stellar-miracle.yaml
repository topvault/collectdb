name: Stellar Miracle
description: The Korean printing of Japan's Stellar Miracle, released in Korea
  on 6 September 2024. The Japanese original came out on 19 July 2024 as the
  seventh main expansion of the Scarlet & Violet era. Terapagos and the Stellar
  type are at the centre of it. The set introduced Stellar Tera Pokémon ex,
  whose powerful gemstone-named attacks need three different Energy types, along
  with Trainer cards that make those costs easier to meet. It has a printed
  total of 102, with secret cards numbered beyond that, and in English it became
  part of Stellar Crown.
