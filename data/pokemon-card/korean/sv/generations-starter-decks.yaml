name: Generations Starter Decks
description: The Korean printing of Japan's Generations Start Decks, released in
  Korea on 20 December 2024 during the Scarlet & Violet era. The Japanese
  originals came out on 22 November 2024 as nine 60-card decks, one for each
  generation of the Pokémon games. Each deck is led by two Pokémon ex, from
  Pikachu ex and Snorlax ex for the first generation to Koraidon ex and Paldean
  Clodsire ex for the ninth. Every deck also has two Professor's Research cards
  showing its generation's Professor. The cards are numbered to a printed total
  of 175.
releaseDate: '2024-12-20'
