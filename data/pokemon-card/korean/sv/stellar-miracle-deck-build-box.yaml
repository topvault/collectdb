name: Stellar Miracle Deck Build Box
description: The Korean printing of Japan's Stellar Miracle Deck Build Box,
  released in Korea on 11 September 2024 during the Scarlet & Violet era. The
  Japanese original came out on 19 July 2024 alongside the Stellar Miracle
  expansion. In Japan the box held 10 Stellar Miracle packs and a fixed set of
  171 cards, made up of 16 Pokémon, 53 Trainers, 6 Special Energy and 96 Basic
  Energy, along with four dividers and an acrylic VSTAR marker. The Basic Energy
  have a new design with a background that looks like crystals. The cards carry
  a printed total of 44.
