name: The Glory of Team Rocket
description: The Korean printing of Japan's The Glory of Team Rocket, released
  in Korea on 20 June 2025 as a Scarlet & Violet expansion pack. The Japanese
  original, the tenth expansion of the Scarlet & Violet era, came out on 18
  April 2025, and its cards were later included in the English Destined Rivals.
  Team Rocket is the theme, with Giovanni and Mewtwo on the pack art, and the
  set introduces Team Rocket's Pokémon, which work the same way as Trainer's
  Pokémon. Its cards have a printed total of 98, and secret cards are numbered
  beyond that.
