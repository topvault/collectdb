name: Pokémon Card 151
description: The Korean printing of Japan's Pokémon Card 151, released in Korea
  on 28 July 2023 as an enhanced expansion pack. The Japanese original came out
  on 16 June 2023 as the first special expansion of the Scarlet & Violet era.
  Only Generation I Pokémon appear, and they are numbered in National Pokédex
  order rather than grouped by type. The set has a printed total of 165, with
  secret cards numbered beyond it. Mirror holo commons, uncommons and rares
  carry a Poké Ball pattern, or more rarely a Master Ball pattern.
releaseDate: '2023-07-28'
printedTotal: 165
integrations:
  pokemonKorea: 스칼렛&바이올렛 강화 확장팩 「포켓몬 카드 151」
links:
  Pokémon Korea: https://pokemoncard.co.kr/card/551
editions:
  reverse-holo:
    name: Reverse Holo
    description: The mirror holofoil version of a card, which the Korean card
      database lists as a card of its own.
    finish: Reverse Holo
  unlimited: Normal
