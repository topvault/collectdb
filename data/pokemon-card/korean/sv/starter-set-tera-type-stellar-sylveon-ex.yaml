name: 'Starter Set Tera Type Stellar: Sylveon ex'
description: A Korean starter set from the Scarlet & Violet era, released on 2
  October 2024 and built around Sylveon ex with the Stellar Tera Type. Its
  Korean title places it in the Scarlet & Violet starter set line. The cards
  carry a printed total of 22. No Japanese product of the same name is known, so
  it may have been made only for the Korean market.
