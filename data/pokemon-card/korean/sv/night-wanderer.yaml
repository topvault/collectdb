name: Night Wanderer
description: The Korean printing of Japan's Night Wanderer, released in Korea on
  9 August 2024 as an enhanced expansion pack of the Scarlet & Violet era. The
  Japanese original came out on 7 June 2024 as the sixth subset of the era, and
  its English counterpart is Shrouded Fable. Its cards carry a printed total of
  64, with secret cards numbered beyond that. Pecharunt appears as a Pokémon ex
  together with the Loyal Three, and the rest of the set brings together Pokémon
  and characters with a shady or villainous side.
