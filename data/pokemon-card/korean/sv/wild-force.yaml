name: Wild Force
description: The Korean printing of Japan's Wild Force, released in Korea on 6
  March 2024 as one half of the fifth Scarlet & Violet expansion. The Japanese
  original came out on 26 January 2024 alongside its partner Cyber Judge, and in
  English both were folded into Temporal Forces. Its cards are numbered to a
  printed total of 71, with secret cards beyond that. The set continues the
  Ancient and Future theme with Paradox Pokémon modelled on the Legendary beasts
  and the Swords of Justice, and it brings back ACE SPEC cards in a new magenta
  design.
