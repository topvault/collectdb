name: 'First Set: Grass Evolution'
description: A Korean product from the Black & White (BW) era, released in Korea
  on 3 May 2011 under the First Set name with the subtitle Grass Evolution. Its
  cards are numbered to a printed total of 34. No Japanese set of the same name
  is known, so it may have been made only for the Korean market rather than as a
  direct printing of a Japanese release.
