name: Black & White Promos
description: The Korean run of promotional cards from the Black & White era,
  released in Korea in 2011. It matches Japan's BW-P promos, which first
  appeared in December 2010 and replaced the older L-P promos when the era began
  with Black Collection and White Collection. The Japanese series grew to 295
  cards, while the Korean run is much smaller, at about 38 cards.
