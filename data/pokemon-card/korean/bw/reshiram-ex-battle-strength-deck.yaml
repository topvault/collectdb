name: Reshiram-EX Battle Strength Deck
description: A Korean deck product from the Black & White (BW) era, built around
  Reshiram-EX and released on 12 April 2012. Its Korean title presents it as a
  60-card Battle Strength deck in the BW line. The cards in it are numbered to a
  printed total of 18. No Japanese product of the same name is known, so it may
  have been made only for the Korean market.
