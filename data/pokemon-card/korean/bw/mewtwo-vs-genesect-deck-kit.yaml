name: Mewtwo Vs Genesect Deck Kit
description: The Korean printing of Japan's Mewtwo vs Genesect Deck Kit,
  released in Korea on 16 December 2013 during the Black & White era. The
  Japanese original came out on 13 July 2013 alongside EX Battle Boost. The kit
  pairs two 30-card half decks, one built around Mewtwo and one around Genesect,
  which use the same set symbol but are numbered separately. Damage markers, a
  Genesect coin and a play guide complete the box, and the Korean cards carry a
  printed total of 16.
releaseDate: '2013-12-16'
