name: Dragon Blast
description: The fifth expansion pack of the Korean Black & White era, released
  in Korea in October 2012. It is the Korean printing of Japan's Dragon Blast,
  which came out on March 16, 2012 as one of two twin sets alongside Dragon
  Blade. Dragon Pokémon are the theme, and because no Dragon Energy exists,
  their attacks call for Energy of other types. The set has a printed total of
  50 cards, and its secret cards are numbered above that total.
