name: Black Collection
description: The first Korean expansion of the Black & White era, released in
  Korea in June 2011. It is the Korean printing of Japan's Black Collection,
  which came out on December 17, 2010 as one of two twin sets alongside White
  Collection. The set brings Generation V Pokémon into the game and introduces
  Abilities in place of Poké-Powers and Poké-Bodies, along with the first Full
  Art cards. Its printed total is 53, and secret cards are numbered beyond that.
releaseDate: '2011-06-01'
printedTotal: 53
