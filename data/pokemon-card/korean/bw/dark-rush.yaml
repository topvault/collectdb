name: Dark Rush
description: The Korean printing of Japan's Dark Rush, the fourth main expansion
  of the Black & White era, released in Korea in May 2012 as the fourth BW
  expansion pack. The Japanese original came out on December 16, 2011, and its
  English counterpart is Dark Explorers. The set has a printed total of 69, with
  secret cards numbered beyond that. Among those secret cards are Item cards,
  which carry a holofoil Poké Ball marking.
