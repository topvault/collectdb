name: Spiral Force
description: The Korean printing of Japan's Spiral Force, released in Korea in
  May 2013 as the eighth Black & White expansion pack. The Japanese original
  came out on December 14, 2012 as one of two twin sets in the eighth Black &
  White block, alongside Thunder Knuckle. Team Plasma remains the theme, and
  many Pokémon are drawn with shards of ice, recalling how Team Plasma and
  Kyurem froze Opelucid City in Pokémon Black 2 and White 2. The set has a
  printed total of 51, and its secret cards are numbered beyond that.
