name: Shiny Collection
description: The Korean printing of Japan's Shiny Collection, a concept pack
  from the Black & White era that first came out in Japan in February 2013 and
  reached Korea in August 2013. The set was designed with girls in mind, in both
  its packaging and its illustration style. Packs hold four cards instead of the
  usual five, and the holofoil cards use a bubble pattern with a foil watermark
  unique to each Pokémon. The Korean release has 25 cards. Outside Japan and
  Korea, the same cards were later reprinted as the Radiant Collection in
  Legendary Treasures.
