name: Team Plasma Deck
description: A Korean deck product from the Black & White era, built around Team
  Plasma and released in Korea on 14 February 2013. Its Korean title places it
  in the BW product line, and its cards carry a printed total of 16. No Japanese
  release of the same name is known, so it may have been made only for the
  Korean market.
