name: Psycho Drive
description: The third Black & White expansion pack in Korea, released on March
  8, 2012 as the Korean printing of Japan's Psycho Drive. The Japanese original
  came out on September 16, 2011, paired with Hail Blizzard to form the era's
  third block. Its printed total is 52, and secret cards numbered beyond it show
  Shiny Pokémon that reprint earlier Black & White cards. The set includes
  Pokémon-EX, which are Basic Pokémon that give the opponent two Prize cards
  when knocked out, in both regular and Full Art versions. Its artwork is
  inspired by Castelia City and the area around it.
releaseDate: '2012-03-08'
