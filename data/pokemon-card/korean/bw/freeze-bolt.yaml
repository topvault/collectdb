name: Freeze Bolt
description: The Korean printing of Japan's Freeze Bolt, released in Korea in
  December 2012 as the sixth expansion pack of the BW line. In Japan it came out
  on July 13, 2012 as the twin of Cold Flare, and the two sets were later
  combined into the English Boundaries Crossed. The cards draw on Pokémon Black
  2 and White 2 and show Bianca and Cheren in their new outfits. Together with
  Cold Flare, it introduced ACE SPEC cards. The printed total is 59, and secret
  cards are numbered above it.
