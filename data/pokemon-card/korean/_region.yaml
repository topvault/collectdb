  swsh:
    name: Sword & Shield Era
    description: Korean releases of the Sword & Shield era ran from the five Starter
      Set V products on 10 January 2020 to VSTAR Universe on 13 January 2023. Most
      are Korean printings of Japanese products and arrived a few months after the
      originals, though the 25th Anniversary Collection and Pokémon GO launched on
      the same day in both countries. They span the main expansions from Sword and
      Shield to Paradigm Trigger, along with enhanced expansion packs, high class
      packs, special sets, decks and S-P promos. Across the era the cards brought in
      Pokémon V, VMAX, the Single Strike, Rapid Strike and Fusion Strike styles,
      V-UNION and VSTAR. Several starter sets and decks have no known Japanese
      counterpart and may have been made only for Korea.
