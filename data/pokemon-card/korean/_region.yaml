name: Korean
description: Pokémon cards printed in Korean by Pokémon Korea, listed from the official Korean card database. Most Korean sets are the Japanese set of the same code, and Korea also has its own decks, promos and league prizes.
generations:
  dp:
    name: Diamond & Pearl Era
    description: The Korean run of the Diamond & Pearl era, with every product dated
      to 2010. It spans ten DP expansion packs, among them Beginning of the
      Adventure, Clash of Space-Time and Splendid Legend, each with 40 or 60 cards.
      Five decks came out alongside them. Four are built around Darkrai, Dialga,
      Palkia and Cresselia, and the fifth is a 55-card Random Constructed Deck.
      Several expansion and deck titles have no Japanese product of the same name,
      so some may have been made only for Korea. A Korean run of DP-P promos
      completes the era, which in Japan lasted from November 2006 to July 2008 and
      introduced the Generation IV Pokémon.
    series:
      - diamond-and-pearl-promos
