  xy:
    name: XY Era
    description: Korean cards of the XY and XY BREAK eras, released from Collection
      X and Collection Y in March 2014 to Base Pack 20th Anniversary in September
      2016. Most expansions are Korean printings of Japanese sets, arriving a few
      months after the originals. They brought in M Pokémon-EX, then Ancient Traits
      with Gaia Volcano and Tidal Storm, and Pokémon BREAK with Blue Shock and Red
      Flash. Concept packs such as Double Crisis, Legendary Shine Collection and
      PokéKyun Collection came out alongside them. Korea also had products with no
      known Japanese counterpart, including three XY First Set evolution decks,
      several Mega Battle and BREAK theme decks, and the 100-card Base Pack 20th
      Anniversary. A promo run matched Japan's XY-P cards.
