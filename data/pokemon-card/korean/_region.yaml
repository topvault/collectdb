  mega:
    name: Mega Evolution Era
    description: The Korean run of the MEGA Series, which started in Korea on 26
      September 2025 with Mega Brave and Mega Symphonia, about two months after they
      came out in Japan. The era brought back Mega Evolution, with Mega Pokémon
      printed as Pokémon ex worth 3 Prize cards. Most releases are Korean printings
      of Japanese sets. They include the main expansions from Inferno X to Storm
      Emeralda, the MEGA Dream ex High Class Pack, Start Deck 100 Battle Collection
      and 30th Celebration, which came out in Korea on the same day as in Japan.
      Korea also released starter sets with no known Japanese counterpart, built
      around Pokémon such as Mega Gengar ex and Eevee ex, and a run of promos that
      matches Japan's M-P cards.
