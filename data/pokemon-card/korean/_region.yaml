  sm:
    name: Sun & Moon Era
    description: The Korean run of the Sun & Moon era, released from January 2017 to
      December 2019. Most sets are Korean printings of Japanese Sun & Moon sets,
      usually arriving a few months after the originals, from the twin opening
      expansions Collection Sun and Collection Moon through Alter Genesis and the
      closing High Class Pack, Tag All Stars. The cards follow Japan's progression
      from Pokémon-GX to Prism Star cards and then TAG TEAM Pokémon-GX. Alongside
      twelve expansion packs came many enhanced expansion packs, High Class Packs, a
      Detective Pikachu movie pack and a steady flow of starter sets and decks. Some
      products, such as the Sun & Moon Starter Set, have no Japanese product of the
      same name.
