  bw:
    name: Black & White Era
    description: Pokémon Korea's Black & White era ran from May 2011, when three
      First Set evolution decks came out, to the Mewtwo vs Genesect Deck Kit in
      December 2013. Its nine main expansions are Korean printings of Japanese sets,
      from Black Collection and White Collection in June 2011 to Megalo Cannon in
      September 2013. They usually reached Korea about half a year after Japan,
      mostly as twin pairs released on the same day. Shiny Collection and EX Battle
      Boost followed as concept packs. Many of its decks, such as the Battle
      Strength line, have no known Japanese counterpart, and neither does the Dragon
      Collection pack. Built on Generation V Pokémon, the era brought Abilities,
      Full Art cards, Pokémon-EX and ACE SPEC cards, and its promos match Japan's
      BW-P series.
