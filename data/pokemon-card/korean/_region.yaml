  sv:
    name: Scarlet & Violet Era
    description: The Korean run of the Scarlet & Violet era, from the first Starter
      Set ex decks on 28 February 2023 to Black Bolt and White Flare on 1 August
      2025, with SV-P promos alongside. Most sets are Korean printings of Japanese
      releases and usually came out one to two months after the originals.
      Generation IX and Paldea set the theme, with Pokémon ex, the Tera mechanic and
      Ancient and Future Paradox cards. Main expansions were joined by enhanced
      expansion packs such as Pokémon Card 151, the High Class Packs Shiny Treasure
      ex and Terastal Festival ex, deck build boxes and special deck sets. Korea
      also had starter products with no known Japanese counterpart, among them the
      Starter Set Terastal, Starter Deck & Build Set and Battle Master Deck lines.
