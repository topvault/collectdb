name: Tidal Storm
description: The Korean printing of Japan's Tidal Storm, which came out in Japan
  in December 2014 and reached Korea in February 2015. It is one half of the
  fifth XY expansion, paired with Gaia Volcano, and the two were later merged
  into the English Primal Clash. The pair draws on Omega Ruby and Alpha
  Sapphire, features Primal Kyogre and Primal Groudon, and introduced Ancient
  Traits. It has a printed total of 70 cards, and secret cards are numbered
  beyond that.
