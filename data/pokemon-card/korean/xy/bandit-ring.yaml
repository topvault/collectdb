name: Bandit Ring
description: The Korean printing of Japan's Bandit Ring, the seventh and final
  main expansion of the XY era, which came out in Japan in June 2015 and reached
  Korea in July 2015. It has a printed total of 81 cards, and secret cards are
  numbered above that. Drawing on Omega Ruby and Alpha Sapphire, the set is
  built around Hoopa, and Primal Kyogre and Primal Groudon appear as secret
  cards. Ancient Traits and Pokémon-EX carry on from earlier sets. Its English
  counterpart is Ancient Origins.
releaseDate: '2015-07-01'
