name: Red Flash
description: The Korean printing of Japan's Red Flash, which came out in Japan
  on 26 September 2015 and was released in Korea in 2015. It is one half of the
  first expansion pair of the XY BREAK era, alongside Blue Shock, and both sets
  center on Mewtwo. The set has a printed total of 59 cards, and secret cards
  are numbered above that. It introduces Pokémon BREAK cards, which are printed
  sideways with a gold finish. The English counterpart is BREAKthrough.
