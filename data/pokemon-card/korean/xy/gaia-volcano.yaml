name: Gaia Volcano
description: The Korean printing of Japan's Gaia Volcano, one of the twin
  expansions that made up the fifth block of the XY era. It came out in Japan in
  December 2014 alongside Tidal Storm and reached Korea in February 2015. Primal
  Groudon and Primal Kyogre feature in the set, which introduced Ancient Traits,
  special effects shown in a bar across the top of the artwork. It has a printed
  total of 70 cards, and secret cards are numbered above that. From this set on,
  M Pokémon-EX were printed as both regular and Full Art cards.
