name: Golduck BREAK + Palkia-EX Combo Deck
description: A Korean 60-card deck from the XY era, released in Korea on 19
  November 2015 as the Korean printing of Japan's Golduck BREAK + Palkia-EX
  Combo Deck, which came out on 9 October 2015. The deck was designed to show
  how the Pokémon BREAK mechanic works together with Pokémon-EX. Golduck and
  Palkia lead it, backed by other Pokémon and supporting Trainer cards. Its
  cards carry a printed total of 16.
