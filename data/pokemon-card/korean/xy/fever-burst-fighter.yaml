name: Fever-Burst Fighter
description: The Korean printing of Japan's Fever-Burst Fighter, released in
  Korea on 26 July 2016 as the eleventh XY BREAK expansion pack. In Japan it
  came out on 17 June 2016, paired with Cruel Traitor as the last main expansion
  block of the XY BREAK era, and the two were combined into the English Steam
  Siege. The set has a printed total of 54 cards, with secret cards numbered
  beyond that. Volcanion leads its theme, and dual-type Pokémon cards show a
  diagonal split between their two type colors.
