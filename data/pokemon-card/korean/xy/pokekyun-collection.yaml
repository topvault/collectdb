name: PokéKyun Collection
description: The Korean printing of Japan's PokéKyun Collection, the first
  subset of the XY BREAK era, which came out in Japan on 29 January 2016 and in
  Korea on 1 April 2016. The concept pack has 32 cards and sells four cards to a
  pack. Every card has a gloss coating and a holofoil inset. A column of charms
  runs down the left side of each artwork, and the charms are meant to tell a
  story about the Pokémon. In English, the same cards later appeared in the
  Radiant Collection of Generations.
