name: Emerald Break
description: The Korean printing of Japan's Emerald Break, the sixth main
  expansion of the XY era. It came out in Japan on 14 March 2015 and reached
  Korea on 1 April 2015. The set has a printed total of 78 cards, and its secret
  cards are numbered above that. It draws on Omega Ruby and Alpha Sapphire, and
  Ancient Traits and Pokémon-EX carry over from earlier XY sets. Its English
  counterpart is Roaring Skies.
