name: Legendary Shine Collection
description: The Korean printing of Japan's Legendary Shine Collection, a
  concept pack that was the second and last subset of the XY era. It came out in
  Japan in July 2015 and reached Korea in November 2015. The set has 27 cards,
  and most of its Pokémon appear in the eighteenth Pokémon movie, which features
  Hoopa. Every card has a glossy coating with a special holofoil inset.
