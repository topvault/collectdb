name: Cruel Traitor
description: The Korean printing of Japan's Cruel Traitor, released in Korea on
  26 July 2016 as the eleventh XY BREAK expansion pack. The Japanese original
  came out on 17 June 2016 as one of two twin expansions in the fourth and final
  block of the XY BREAK era, alongside Fever-Burst Fighter. Its English
  counterpart is Steam Siege. The set has a printed total of 54, and secret
  cards are numbered above that. Dual-type Pokémon appear, with a diagonal line
  across the card showing the colours of both types.
