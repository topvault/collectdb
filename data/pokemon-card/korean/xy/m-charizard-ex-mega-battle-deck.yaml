name: M Charizard-EX Mega Battle Deck
description: A Korean deck product from the XY era, built around M Charizard-EX
  and released on 3 June 2014 as part of the XY Mega Battle line of 60-card
  decks. Its cards carry a printed total of 21. No Japanese product of the same
  name is known, so it may have been made only for the Korean market.
