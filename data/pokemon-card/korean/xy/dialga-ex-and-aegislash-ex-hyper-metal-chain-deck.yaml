name: Dialga-EX and Aegislash-EX Hyper Metal Chain Deck
description: A Korean deck product from the XY era, built around Dialga-EX and
  Aegislash-EX and released on 23 October 2014. Its Korean title calls it a
  60-card deck under the Hyper Metal Chain name, and its own cards are numbered
  to a printed total of 18. No Japanese product of the same name is known, so it
  may have been made only for the Korean market.
