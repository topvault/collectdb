name: Rage of the Broken Heavens
description: The Korean printing of Japan's Rage of the Broken Heavens, the
  second expansion of the XY BREAK era, which came out in Japan in December 2015
  and reached Korea in 2016 as the ninth expansion of the Korean XY line. It
  draws on Omega Ruby and Alpha Sapphire and is built around Gyarados, with both
  Pokémon-EX and Pokémon BREAK cards. The printed total is 80, and secret cards
  are numbered above it. In English, these cards appeared in BREAKpoint.
releaseDate: '2016-01-01'
printedTotal: 80
