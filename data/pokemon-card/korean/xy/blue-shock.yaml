name: Blue Shock
description: The Korean printing of Japan's Blue Shock, which opened the XY
  BREAK era in Japan on 26 September 2015 together with its twin set Red Flash.
  In Korea it came out in September 2015 as the eighth expansion pack of the XY
  series. It has a printed total of 59 cards, and secret cards are numbered
  above that. The set introduces Pokémon BREAK, a further evolution laid
  sideways over a Pokémon to add HP and an extra attack or Ability. These cards
  are printed horizontally with gold CGI artwork.
releaseDate: '2015-09-01'
