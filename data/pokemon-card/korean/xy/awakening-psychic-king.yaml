name: Awakening Psychic King
description: This is the Korean printing of Japan's Awakening Psychic King, the
  third expansion of the XY BREAK era. It came out in Japan on 18 March 2016,
  and the Korean edition was also released in March 2016. The set has a printed
  total of 78 cards, and secret cards are numbered above that. Alakazam and
  Zygarde are its headline Pokémon. Its English counterpart is Fates Collide.
