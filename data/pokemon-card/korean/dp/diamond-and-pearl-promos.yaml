name: Diamond & Pearl Promos
description: The Korean run of promotional cards from the Diamond & Pearl era,
  released in Korea in 2010. It matches Japan's DP-P promos, which took over
  from the PCG-P promos when the Diamond & Pearl era began and first appeared in
  November 2006 alongside Space-Time Creation. Like the Japanese originals, most
  of these cards are reprints of cards from the main expansions. The Korean run
  has about 22 cards.
