name: Remix Bout
description: The Korean printing of Japan's Remix Bout, an enhanced expansion
  pack from the Sun & Moon era, released in Korea on 10 September 2019. The
  Japanese original came out on 5 July 2019 as the seventeenth subset of the
  era, and it is counted as the first enhancement of Miracle Twin. The set has a
  printed total of 64, and further cards are numbered beyond that, bringing the
  Japanese release to 80 cards in all.
