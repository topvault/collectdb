name: Sun & Moon Enhanced Expansion Pack
description: The Korean printing of Japan's enhanced expansion pack titled Sun &
  Moon, released in Korea on 24 March 2017 during the Sun & Moon era. The
  Japanese original came out on 27 January 2017, between the era's first and
  second main expansion blocks. In English, its cards were combined with the
  second block and the Rockruff Full Power Deck to make up Guardians Rising. The
  Korean set has a printed total of 51 cards.
