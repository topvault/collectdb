name: Tapu Bulu-GX Enhanced Starter Set
description: The Korean printing of Japan's Tapu Bulu-GX Enhanced Starter Set,
  released in Korea on 27 April 2017 during the Sun & Moon era. The Japanese
  original came out on 17 March 2017, the same day as Islands Await You and
  Alolan Moonlight. Like the original, it is a 60-card deck built around the
  Land Spirit Tapu Bulu. It is made up of 21 exclusive cards and 18 basic Energy
  cards, and it always includes two Pokémon-GX. The set's printed total is 21.
