name: Great Detective Pikachu
description: The Korean printing of Japan's Great Detective Pikachu, a Sun &
  Moon movie special pack tied to the live-action Detective Pikachu film. The
  Japanese original came out on 26 April 2019, and the Korean release is dated
  the same day. The set has 25 cards, 24 of them numbered, and every pack holds
  four foil cards, with even the Common and Uncommon cards in Mirror Holofoil.
  Its English counterpart is the 18-card Detective Pikachu set, released a month
  earlier.
