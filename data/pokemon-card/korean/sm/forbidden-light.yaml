name: Forbidden Light
description: The Korean printing of Japan's Forbidden Light, the sixth main
  expansion of the Sun & Moon era, released in Korea on 6 April 2018. The
  Japanese original came out on 2 March 2018 as a standalone set rather than one
  of a pair. Its English counterpart, also named Forbidden Light, combines it
  with the Ultra Force subset. The set has a printed total of 94, with secret
  cards numbered beyond that. It draws on Ultra Sun and Ultra Moon, featuring
  the Kalos region and Necrozma, and Pokémon-GX and Prism Star cards carry on
  from earlier sets.
releaseDate: '2018-04-06'
