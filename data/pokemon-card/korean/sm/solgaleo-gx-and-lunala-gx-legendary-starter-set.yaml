name: Solgaleo-GX & Lunala-GX Legendary Starter Set
description: A Korean printing of Japan's Solgaleo-GX & Lunala-GX Legendary
  Starter Set, released in Korea on 9 February 2018 during the Sun & Moon era.
  The Japanese original came out on 10 November 2017. It is a 60-card starter
  deck built around the Legendary Pokémon Solgaleo and Lunala as Pokémon-GX, and
  a few of its cards are new, including those two GX cards. The Japanese box
  also held a rulebook, a player's guide, a Cosmog coin, damage counters,
  markers and a GX marker. The deck has 21 different cards, matching its printed
  total.
