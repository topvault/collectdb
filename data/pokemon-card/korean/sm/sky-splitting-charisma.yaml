name: Sky-Splitting Charisma
description: The Korean printing of Japan's Sky-Splitting Charisma, the seventh
  main expansion of the Sun & Moon era, released in Korea on 24 July 2018 as the
  seventh SM expansion pack. The Japanese original came out on 1 June 2018, and
  its cards later went into the English Celestial Storm along with the Champion
  Road subset. The set has a printed total of 96, with secret cards numbered
  beyond that. It draws on Ultra Sun and Ultra Moon, with a focus on the Hoenn
  region and Rayquaza, and it brings back older Neo, e-Card and EX Series cards
  in updated form.
releaseDate: '2018-07-24'
