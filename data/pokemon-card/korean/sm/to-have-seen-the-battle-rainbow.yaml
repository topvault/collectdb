name: To Have Seen the Battle Rainbow
description: The Korean printing of Japan's To Have Seen the Battle Rainbow,
  released in Korea on 7 July 2017 as the third Sun & Moon expansion pack. In
  Japan it came out on 16 June 2017 and made up one half of the third main
  expansion of the Sun & Moon era, alongside Darkness that Consumes Light. That
  pair became the English Burning Shadows. The set has a printed total of 51,
  with secret cards numbered beyond that. It draws on Pokémon Sun and Moon and
  features the Prism Pokémon Necrozma.
