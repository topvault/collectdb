name: GG End
description: The Korean printing of Japan's GG End, released in Korea on 12 June
  2019 as an enhanced expansion pack for the Sun & Moon era. The Japanese
  original came out on 5 April 2019 in 5-card packs as the fifteenth subset of
  the Sun & Moon era. It is counted as the first enhancement of Double Blaze.
  The set has a printed total of 54 and 69 cards in all, so some cards are
  numbered beyond the printed total.
