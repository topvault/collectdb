name: Miracle Twin
description: The Korean printing of Japan's Miracle Twin, released in Korea on 7
  August 2019 as the eleventh Sun & Moon expansion pack. The Japanese original
  was the eleventh main expansion of the Sun & Moon era and came out on 31 May
  2019. Its English counterpart is Unified Minds. The set continues the TAG TEAM
  Pokémon-GX mechanic and has a printed total of 94 cards. In Japan it held 115
  cards in all, counting the ones numbered above that total.
