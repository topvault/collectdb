name: Tag Bolt
description: The Korean printing of Japan's Tag Bolt, released in Korea on 16
  January 2019 as a Sun & Moon expansion pack. The Japanese original, the ninth
  main expansion of the Sun & Moon era, came out on 7 December 2018, and its
  English counterpart is Team Up. The set has a printed total of 95, with
  further cards numbered beyond that. It draws on Pokémon Let's Go, Pikachu and
  Let's Go, Eevee, featuring Generation I Pokémon and the Kanto region. It
  introduced TAG TEAM Pokémon-GX, Basic cards pairing two Pokémon of the same
  type that give up three Prize cards when Knocked Out.
releaseDate: '2019-01-16'
printedTotal: 95
