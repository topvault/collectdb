name: Ultra Moon
description: The Korean printing of Japan's Ultra Moon, released in Korea on 17
  January 2018 as the fifth Sun & Moon expansion pack. The Japanese original
  came out on 8 December 2017 alongside its partner set Ultra Sun, and the two
  halves together became the English Ultra Prism. The set has a printed total of
  66, with secret cards numbered beyond that. Prism Star cards, which are
  limited to one copy per deck, first appeared in this block, and fossil Pokémon
  went back to evolving from a shared Trainer card.
