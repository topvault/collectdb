name: Collection Sun
description: The Korean printing of Japan's Collection Sun, released in Korea on
  9 February 2017 as the first Sun & Moon expansion pack. The Japanese original
  came out on 9 December 2016 with its twin, Collection Moon. Together the two
  became the basis of the English Sun & Moon set. The set has a printed total of
  60, and its secret cards are numbered above that. It was the first to bring
  Generation VII Pokémon into the card game. It also introduced Pokémon-GX,
  which give up two Prize cards when Knocked Out and have a GX attack that can
  be used once per game.
