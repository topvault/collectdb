name: Dream League
description: The Korean printing of Japan's Dream League, released in Korea on
  11 October 2019 as a Sun & Moon enhanced expansion pack. The Japanese original
  came out on 2 August 2019 as the eighteenth subset of the Sun & Moon era, and
  it serves as the second enhancement pack for Miracle Twin. The set has a
  printed total of 49, with further cards numbered beyond that, and Full Art
  cards are among its contents.
