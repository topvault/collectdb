name: Dark Order
description: The Korean printing of Japan's Dark Order, an enhanced expansion
  pack from the Sun & Moon era, released in Korea on 13 December 2018. The
  Japanese original came out on 5 October 2018 as the eleventh subset of the era
  and was sold in 5-card packs. It was made to support Super-Burst Impact, an
  earlier expansion. The set has a printed total of 52, and its secret cards are
  numbered beyond that, bringing it to 65 cards in all.
