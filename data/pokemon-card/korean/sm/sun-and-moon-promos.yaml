name: Sun & Moon Promos
description: The Korean run of promotional cards from the Sun & Moon era. It
  corresponds to Japan's SM-P promos, which began appearing on November 18,
  2016. On the Japanese cards, every number carries the SM-P suffix, and a
  rectangular PROMO symbol takes the place of the black star used on earlier
  promos. Many of the Japanese promos were sold in special sets that combined
  one foil promo card with a few booster packs. The Korean run has about 234
  cards.
releaseDate: 0-01-01
