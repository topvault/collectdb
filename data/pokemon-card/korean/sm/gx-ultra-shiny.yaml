name: GX Ultra Shiny
description: The Korean printing of Japan's GX Ultra Shiny, a High Class Pack
  from the Sun & Moon era, released in Korea on 28 February 2019. The Japanese
  original came out on 2 November 2018, sold in 10-card packs that each
  guaranteed a Pokémon-GX. The set has a printed total of 150, and a large run
  of secret cards is numbered above that. Many of its cards are reprints,
  following earlier High Class Packs such as GX Battle Boost. Its cards later
  formed the core of the English Hidden Fates.
