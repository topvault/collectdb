name: Darkness that Consumes Light
description: The Korean printing of Japan's Darkness that Consumes Light,
  released in Korea on 7 July 2017 as the third expansion pack of the Sun & Moon
  era. The Japanese original came out on June 16, 2017 as one half of the era's
  third main expansion, beside To Have Seen the Battle Rainbow, and the two
  halves together became the English Burning Shadows. The set has a printed
  total of 51, with secret cards numbered beyond that. Necrozma is the headline
  Pokémon of the expansion.
