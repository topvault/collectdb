name: Thunderclap Spark
description: The Korean printing of Japan's Thunderclap Spark, released in Korea
  on 15 November 2018 as an enhanced expansion pack of the Sun & Moon era. The
  Japanese original came out on July 6, 2018 as the ninth subset of the era, and
  it serves as the first enhancement of Sky-Splitting Charisma. The set has a
  printed total of 60, with further cards numbered beyond that.
