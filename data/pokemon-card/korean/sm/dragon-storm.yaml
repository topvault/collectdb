name: Dragon Storm
description: The Korean printing of Japan's Dragon Storm, an enhanced expansion
  pack of the Sun & Moon era, released in Korea on 1 June 2018. The Japanese
  original came out on 6 April 2018 as the era's seventh subset. It was the
  first of two subsets that enhance Forbidden Light. The set has a printed total
  of 53, and its 66 cards include secret cards numbered beyond that. Its English
  counterpart is Dragon Majesty.
