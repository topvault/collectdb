name: Champion Road
description: The Korean printing of Japan's Champion Road, an enhanced expansion
  pack from the Sun & Moon era, released in Korea on 2 July 2018. The Japanese
  original came out on 3 May 2018 as the eighth subset of the era and the second
  enhancement of Forbidden Light. Its cards later became part of the English
  Celestial Storm. The set has a printed total of 66 and reprints cards from the
  Neo, e-Card, ADV and PCG eras in the modern card layout.
