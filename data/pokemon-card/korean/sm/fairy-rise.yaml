name: Fairy Rise
description: The Korean printing of Japan's Fairy Rise, released in Korea on 19
  September 2018 as a Sun & Moon enhanced expansion pack. The Japanese original
  came out on 3 August 2018 as the tenth set of the Sun & Moon era, and it
  serves as the second enhancement of Sky-Splitting Charisma. The set has a
  printed total of 50, with further cards numbered beyond that. In Japan the
  full set ran to 63 cards.
