name: Collection Moon
description: The Korean printing of Japan's Collection Moon, released in Korea
  on 9 February 2017 as the first Sun & Moon expansion pack. The Japanese
  original came out on 9 December 2016 as one half of the twin expansions that
  opened the Sun & Moon era, alongside Collection Sun, and the pair became the
  English Sun & Moon set. The set has a printed total of 60, with secret cards
  numbered beyond that. With its twin, it was the first to bring Generation VII
  Pokémon to the card game and introduced Pokémon-GX, which give up two Prize
  cards when Knocked Out and have a GX attack usable once per game.
