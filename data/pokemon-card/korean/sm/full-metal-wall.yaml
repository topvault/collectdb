name: Full Metal Wall
description: The Korean printing of Japan's Full Metal Wall, an enhanced
  expansion pack from the Sun & Moon era, released in Korea on 12 April 2019.
  The Japanese original came out on 1 February 2019 as the fourteenth subset of
  the era, and it serves as the second enhancement of Tag Bolt. The set has a
  printed total of 54. The Japanese release has 69 cards in all, so the extra
  cards are numbered beyond that total.
