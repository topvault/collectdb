name: Double Blaze
description: The Korean printing of Japan's Double Blaze, the tenth main
  expansion of the Sun & Moon era, released in Korea on 10 May 2019. The
  Japanese original came out on 1 March 2019, and its English counterpart is
  Unbroken Bonds. The set has a printed total of 95, and its secret cards are
  numbered beyond that. It draws on Ultra Sun and Ultra Moon and on the Let's Go
  games, and it features TAG TEAM Pokémon-GX.
