name: Storm Emeralda
description: The Korean printing of Japan's Storm Emeralda, the sixth expansion
  of the MEGA Series. It came out in Japan on 31 July 2026 and reached Korea on
  21 August 2026. The set has a printed total of 76 cards, with secret cards
  numbered above that, and each pack holds five cards. It draws mainly on Omega
  Ruby and Alpha Sapphire, though Mega Evolution Pokémon from Legends Z-A still
  appear. It also introduces Legendary Stadiums, which are pairs of Stadium
  cards that split one artwork in two and are played together as a single large
  card. Its English counterpart is Delta Reign.
releaseDate: '2026-08-21'
