name: Ninja Spinner
description: The Korean printing of Japan's Ninja Spinner, the fourth main
  expansion of the MEGA Series. It came out in Japan on 13 March 2026 and
  reached Korea on 1 May 2026. The set has a printed total of 83 cards, and its
  secret cards are numbered above that. Mega Greninja leads the set, which
  focuses on the Kalos first partner Pokémon and the final act of Pokémon
  Legends Z-A, with some cards based on Ange. Its cards appear in English in
  Chaos Rising.
