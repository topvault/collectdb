name: Abyss Eye
description: The Korean printing of Japan's Abyss Eye, the fifth main expansion
  of the MEGA era. It came out in Japan on 22 May 2026 and reached Korea on 26
  June 2026. The set has a printed total of 81 cards and is sold in five-card
  packs. It is the first set based on the Mega Dimension DLC, and like earlier
  MEGA sets it features Pokémon ex and Trainer cards taken from the game. Its
  cards appear in English in Pitch Black.
