name: Mega Evolution Promos
description: The Korean run of promotional cards from the MEGA Series era,
  matching Japan's M-P promos. The Japanese series began on 1 August 2025, when
  card 001/M-P appeared in the first MEGA Series Pokémon Card Gym Promo Card
  Pack. Every card is numbered with the M-P suffix and shows the word PROMO
  where an expansion code would normally sit. The Korean run has about 80 cards.
