name: Nullifying Zero
description: The Korean printing of Japan's Nullifying Zero, the third expansion
  of the MEGA Series. It came out in Japan on 23 January 2026 and reached Korea
  on 13 March 2026. The set has a printed total of 80 cards, and its secret
  cards are numbered above that. It is the first booster set built entirely
  around Pokémon Legends Z-A, and Mega Zygarde appears in it as a Pokémon ex.
  Its cards also appear in the English set Perfect Order.
