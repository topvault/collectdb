name: Inferno X
description: The Korean printing of Japan's Inferno X, the second expansion of
  the MEGA Series. It came out in Japan on 26 September 2025 and reached Korea
  on 28 November 2025. Mega Charizard X leads the set, which also brings
  supporting Pokémon and Trainer cards for the Fire and Darkness types. Its
  printed total is 80 cards, and its secret cards are numbered above that. In
  English, its cards are part of Phantasmal Flames.
