name: MTG Cards
support: full
releaseDate: '1993-08-05'
regions:
  - english
remarks:
  # Promotional distribution.
  promo-trophy:
    name: Promo Trophy
    description: Awarded for placing in a competition, such as the oversized cards given to each Vintage champion.
  promo-prerelease:
    name: Promo Prerelease
    description: Prerelease promotional distribution, often date-stamped.
  promo-generic:
    name: Promo
    description: Promotional distribution other than a prerelease, such as an event, store, league, buy-a-box, or bundle promo.
  # Retail reprints.
  reprint-championship-deck:
    name: Championship Deck
    description: A World Championship Deck or Pro Tour Collector Set deck, sold at retail as a reprint of a tournament player's deck.
rarities:
  # The rarity mark printed on the card, written by name in details.rarity. Listed from the
  # lowest rarity to the highest, which is the order a rarity sort uses.
  common:
    name: Common
    description: A black set symbol.
    symbols:
      - color: '#1a1718'
  uncommon:
    name: Uncommon
    description: A silver set symbol.
    symbols:
      - color: '#707883'
  rare:
    name: Rare
    description: A gold set symbol.
    symbols:
      - color: '#a58e4a'
  mythic-rare:
    name: Mythic Rare
    description: An orange-red set symbol.
    symbols:
      - color: '#bf4427'
  special:
    name: Special
    description: A purple set symbol, such as Time Spiral's timeshifted cards.
    symbols:
      - color: '#652978'
  bonus:
    name: Bonus
    description: Scryfall's rarity for a set's bonus-sheet cards.
finishes:
  # Written by name in details.finish; a card without one is non-holo (or nonfoil).
  foil:
    name: Foil
  etched:
    name: Etched
    description: Foil-etched, with a metallic etched pattern.
