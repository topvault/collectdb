name: MTG Cards
support: full
releaseDate: '1993-08-05'
regions:
  - english
remarks:
  # Promotional distribution.
  promo-trophy:
    name: Promo Trophy
    description: Awarded for placing in a competition, such as the oversized cards given to each Vintage champion.
  promo-prerelease:
    name: Promo Prerelease
    description: Prerelease promotional distribution, often date-stamped.
  promo-generic:
    name: Promo
    description: Promotional distribution other than a prerelease, such as an event, store, league, buy-a-box, or bundle promo.
  # Retail reprints.
  reprint-championship-deck:
    name: Championship Deck
    description: A World Championship Deck or Pro Tour Collector Set deck, sold at retail as a reprint of a tournament player's deck.
