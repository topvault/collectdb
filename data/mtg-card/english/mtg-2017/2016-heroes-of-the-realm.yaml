name: 2016 Heroes of the Realm
description: 2016 Heroes of the Realm are cards Wizards of the Coast made to
  honor its own teams and employees for their work in 2016. They were never
  sold, and only four copies of each 2016 card exist. The winners design their
  cards, which have black-bordered fronts, a special Heroes of the Realm back
  and the recipient's name printed near the bottom. Physical cards often reach
  employees the following year, and an oversized copy of each hangs in the Hall
  of Heroes at Wizards headquarters. They are not legal in any format, though
  Commander allows one played by the person named on it.
releaseDate: 'September 2017'
