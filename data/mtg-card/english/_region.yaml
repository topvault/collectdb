name: English
generations:
  mtg-1993:
    name: 'MTG: 1993'
    description: Magic began in 1993 with Limited Edition, known as Alpha and Beta,
      and the white-bordered Unlimited Edition followed in December. Arabian Nights
      was the first expansion, and Collectors' Edition gathered the Beta cards in
      square-cornered form.
    series:
      - limited
      - unlimited
      - arabian-nights
      - collectors-edition
  mtg-1994:
    name: 'MTG: 1994'
    description: Magic released Revised Edition as its third core set in 1994, and
      Summer Magic was a short-lived run of it. The year also brought four
      expansions outside any block, Antiquities, Legends, The Dark and Fallen
      Empires, and the first of the promo sets.
    series:
      - antiquities
      - revised
      - legends
      - summer-magic
      - the-dark
      - fallen-empires
      - promo-sets

  mtg-1995:
    name: 'MTG: 1995'
    description: Ice Age arrived in 1995 and began the Ice Age block, and Homelands
      followed in October. Chronicles reprinted cards from earlier expansions, and
      Fourth Edition replaced Revised as the core set.
    series:
      - homelands
      - chronicles
      - ice-age
      - fourth-edition
      - promo-sets

  mtg-1996:
    name: 'MTG: 1996'
    description: In 1996 Alliances finished the Ice Age block and Mirage began a
      block of its own. The Introductory Two-Player Set, the first box set in
      Magic's history, and the Rivals Quick Start Set were aimed at new players, and
      the Pro Tour Collector Set also came out.
    series:
      - introductory-two-player-set
      - mirage
      - rivals-quick-start-set
      - alliances
      - pro-tour-collector-set
      - promo-sets

  mtg-1997:
    name: 'MTG: 1997'
    description: Visions and Weatherlight completed the Mirage block in 1997, and
      Tempest opened the next. Fifth Edition became the core set, Portal launched a
      simpler game for new players, and the World Championship Decks reproduced
      decks from that year's championship with gold borders.
    series:
      - tempest
      - world-championship-decks-1997
      - weatherlight
      - portal
      - vanguard-series
      - fifth-edition
      - visions
      - promo-sets

  mtg-1998:
    name: 'MTG: 1998'
    description: Stronghold and Exodus closed the Tempest block in 1998, and Urza's
      Saga started the Urza block. The year also brought Unglued, a silver-bordered
      set made for fun outside normal play, Portal Second Age, the Anthologies box
      set and another year of World Championship Decks.
    series:
      - anthologies
      - urzas-saga
      - world-championship-decks-1998
      - unglued
      - portal-second-age
      - exodus
      - stronghold
      - promo-sets

  mtg-1999:
    name: 'MTG: 1999'
    description: Urza's Legacy and Urza's Destiny ended the Urza block in 1999, and
      Mercadian Masques began the Masques block. Classic Sixth Edition updated the
      core set, while Starter 1999, Portal Three Kingdoms and the Battle Royale Box
      Set offered ways into the game.
    series:
      - battle-royale-box-set
      - mercadian-masques
      - world-championship-decks-1999
      - urzas-destiny
      - starter-1999
      - portal-three-kingdoms
      - classic-sixth-edition
      - urzas-legacy
      - promo-sets

  mtg-2000:
    name: 'MTG: 2000'
    description: Nemesis and Prophecy finished the Masques block in 2000, and
      Invasion opened a block about Dominaria's five colors uniting against
      Phyrexia. Starter 2000 and the Beatdown Box Set were made for newer players,
      and the World Championship Decks continued.
    series:
      - invasion
      - beatdown-box-set
      - world-championship-decks-2000
      - prophecy
      - starter-2000
      - nemesis
      - promo-sets

  mtg-2001:
    name: 'MTG: 2001'
    description: Planeshift and Apocalypse completed the Invasion block in 2001, and
      Odyssey started a new one. Seventh Edition was the year's core set, and
      Deckmasters paired decks themed on Richard Garfield and Jon Finkel.
    series:
      - deckmasters-garfield-vs-finkel
      - odyssey
      - world-championship-decks-2001
